<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data Extractor</title>

<!--
  ============================================================================
  DATA EXTRACTOR  —  single-file, fully client-side
  ============================================================================
  Drop a file or paste text. Everything is parsed in your browser. Nothing is
  ever uploaded. The ONLY network traffic is pulling parser libraries from a
  CDN, and even those are loaded lazily (only when a format needs them).

  ARCHITECTURE (one shared spine, not three tools):
    1. INPUT LAYER     paste box + drag/drop zone (multi-file, pooled)
    2. ROUTER          detectFormat() dispatches a file to the right parser
    3. NORMALIZATION   every parser returns the same shape:
                         { name, text, images:[{name,blob}], tables:[{name,rows}] }
    4. EXTRACTION      text sieves (regex) + structure lenses (images/tables)
    5. OUTPUT LAYER    ONE implementation of Copy All / Download, reused by all

  Libraries (lazy-loaded from CDN, see LIBS below):
    PDF.js, mammoth.js, SheetJS (xlsx), PapaParse, JSZip
  ============================================================================
-->

<style>
  /* ==========================================================================
     BLURPRINT THEME — design tokens
     Feel: Discord's rounded geometry tuned for white/paper. Outline over fill,
     saturated color only in small areas.
     ========================================================================== */
  :root {
    /* Canvas / text */
    --bg: #FFFFFF;
    --heading: #1E1F22;
    --text-primary: #2E3035;
    --text-body: #4E5058;
    --text-body-2: #5C5E66;
    --muted: #80848E;
    --faint: #9A9DA5;
    --faint-2: #B5BAC1;

    /* Borders */
    --border: #E3E5E8;
    --divider: #F2F3F5;
    --hairline: #EEF0F2;

    /* Accent (blurple) */
    --accent: #5865F2;
    --accent-deep: #4752C4;
    --accent-tint-bg: #EEF0FE;
    --accent-tint-border: #E0E3FB;
    --link: #4752C4;

    /* Status */
    --success: #3BA55C;
    --warning: #E0A416;
    --danger: #D83C3E;
    --neutral: #B5BAC1;

    /* Neutral ramp */
    --n0: #FFFFFF;
    --n1: #F8F9FB;
    --n2: #F2F3F5;
    --n3: #E3E5E8;

    /* Radii */
    --r-card: 12px;
    --r-btn: 8px;
    --r-pill: 999px;

    /* Type */
    --font: 'Aptos','Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,sans-serif;
    --mono: 'Aptos Mono','Cascadia Code',ui-monospace,monospace;
  }

  * { box-sizing: border-box; }

  ::selection { background: #D9DDFB; }

  /* Always reserve space for the vertical scrollbar so switching between a
     long view (Raw Text) and a short one (Standards) never shifts the layout. */
  html { scrollbar-gutter: stable; overflow-y: scroll; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text-body);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1500px;
    margin: 0 auto;
    padding: 18px 28px 60px;
  }

  /* ---- Header ---------------------------------------------------------- */
  header.app {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 12px;
  }
  header.app h1 {
    font-size: 20px;
    font-weight: 800;
    color: var(--heading);
    margin: 0;
    letter-spacing: -0.2px;
  }
  .privacy {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 14px 0;
  }
  .dot {
    width: 9px; height: 9px;
    border-radius: var(--r-pill);
    background: var(--success);
    box-shadow: 0 0 0 3px #fff, 0 0 0 4px var(--hairline);
    flex: none;
  }

  /* ---- Section label --------------------------------------------------- */
  .label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 6px 0;
  }

  /* ---- Card ------------------------------------------------------------ */
  .card {
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    background: var(--bg);
    padding: 22px;
    margin-bottom: 14px;
  }
  /* compact cards for the input/options rows above the results */
  .card.tight { padding: 12px 16px; }

  /* ---- Input zone ------------------------------------------------------ */
  .dropzone {
    position: relative;
    border: 1.5px dashed var(--faint-2);
    border-radius: var(--r-card);
    background: var(--n1);
    transition: border-color .15s, background .15s;
  }
  .dropzone.dragover {
    border-color: var(--accent);
    background: var(--accent-tint-bg);
  }
  .dropzone textarea {
    width: 100%;
    min-height: 40px;
    resize: vertical;
    border: none;
    background: transparent;
    padding: 9px 14px;
    font-family: var(--font);
    font-size: 14px;
    color: var(--text-primary);
    outline: none;
    display: block;
  }
  .dropzone textarea::placeholder { color: var(--faint); }

  .dz-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    border-top: 1px solid var(--hairline);
    flex-wrap: wrap;
  }
  .dz-hint { font-size: 12.5px; color: var(--muted); }

  /* ---- File chips ------------------------------------------------------ */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border);
    border-radius: var(--r-pill);
    padding: 5px 6px 5px 12px;
    font-size: 12.5px;
    color: var(--text-body);
    background: var(--bg);
  }
  .chip .chip-dot { width: 7px; height: 7px; border-radius: var(--r-pill); flex: none; }
  .chip-dot.ok { background: var(--success); }
  .chip-dot.busy { background: var(--warning); }
  .chip-dot.err { background: var(--danger); }
  .chip .name { font-weight: 600; color: var(--text-primary); max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .meta { color: var(--muted); }
  .chip-x {
    width: 18px; height: 18px;
    border: none;
    border-radius: var(--r-pill);
    background: var(--n2);
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .chip-x:hover { background: var(--n3); color: var(--text-body); }

  /* ---- Buttons --------------------------------------------------------- */
  button { font-family: var(--font); }
  .btn {
    height: 44px;
    padding: 0 18px;
    border-radius: var(--r-btn);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    display: inline-flex; align-items: center; gap: 8px;
    transition: background .12s, border-color .12s, color .12s;
  }
  .btn.sm { height: 34px; padding: 0 13px; font-size: 13px; }
  .btn.pill { border-radius: var(--r-pill); }

  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }

  .btn-secondary { background: #fff; border-color: #C7CAD1; color: var(--text-body); }
  .btn-secondary:hover { background: var(--n2); border-color: var(--faint-2); }

  .btn-danger { background: #fff; border-color: #EDB5B6; color: var(--danger); }
  .btn-danger:hover { background: #FCEDED; border-color: #E59A9B; }

  .btn-ghost { background: transparent; border-color: transparent; color: var(--accent); }
  .btn-ghost:hover { background: var(--accent-tint-bg); }

  .btn:disabled, .btn[disabled] {
    background: var(--n1); color: var(--faint-2); border-color: var(--n1);
    cursor: not-allowed;
  }
  .btn-icon { width: 40px; height: 40px; padding: 0; justify-content: center; }
  .btn-icon svg { display: block; width: 24px; height: 24px; }

  /* ---- Options bar ----------------------------------------------------- */
  .options { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; }
  .opt {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13.5px; color: var(--text-body); cursor: pointer; user-select: none;
  }
  .opt input[type="checkbox"] { display: none; }
  .toggle {
    width: 36px; height: 20px; border-radius: var(--r-pill);
    background: var(--n3); position: relative; transition: background .15s; flex: none;
  }
  .toggle::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: var(--r-pill);
    background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.18);
  }
  .opt input:checked + .toggle { background: var(--accent); }
  .opt input:checked + .toggle::after { transform: translateX(16px); }
  .opt input:disabled + .toggle { opacity: .45; }

  /* ---- Category pills (two-line: label + tiny example) ----------------- */
  .pills { display: block; }
  .pill-btn {
    display: inline-flex; align-items: center; gap: 9px;
    min-height: 40px; padding: 4px 10px 4px 14px;
    border: 1px solid var(--border); border-radius: 12px;
    background: #fff; color: var(--text-body); cursor: pointer; text-align: left;
    transition: background .12s, border-color .12s, color .12s;
  }
  .pill-btn:hover:not(:disabled) { border-color: var(--faint-2); background: var(--n1); }
  .pill-btn.active { background: var(--accent-tint-bg); border-color: var(--accent-tint-border); }
  .pill-btn:disabled { background: var(--n1); border-color: var(--n2); cursor: not-allowed; }
  .pill-text { display: flex; flex-direction: column; line-height: 1.15; }
  .pill-label { font-size: 13px; font-weight: 600; color: var(--text-primary); }
  .pill-btn.active .pill-label { color: var(--accent-deep); }
  .pill-btn:disabled .pill-label { color: var(--faint-2); }
  .pill-eg { font-size: 9.5px; font-weight: 500; color: var(--faint-2); margin-top: 1px; }
  .badge {
    min-width: 20px; height: 20px; padding: 0 6px;
    border-radius: var(--r-pill); background: var(--n2); color: var(--muted);
    font-size: 11.5px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .pill-btn.active .badge { background: var(--accent); color: #fff; }
  .pill-btn:disabled .badge { background: var(--n2); color: var(--faint-2); }

  /* ---- Options + Global filter (one compact row) ----------------------- */
  .controlrow { display: flex; align-items: center; gap: 16px 22px; flex-wrap: wrap; }
  .controlrow .options { flex: none; }
  .controlrow .filterbar { flex: 1; min-width: 260px; margin: 0; position: relative; }
  .filter-icon { position: absolute; left: 12px; top: 9px; width: 18px; height: 18px; color: var(--faint-2); pointer-events: none; }
  .filter-input {
    width: 100%; height: 38px; padding: 0 14px 0 38px;
    border: 1px solid #C7CAD1; border-radius: var(--r-btn);
    font-size: 13.5px; font-family: var(--font); color: var(--text-primary); background: #fff; outline: none;
  }
  .filter-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint-bg); }
  .filter-input:focus + .filter-icon, .filterbar:focus-within .filter-icon { color: var(--muted); }
  .filter-info { display: block; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .filter-info:empty { display: none; }
  mark.hl { background: #FFE9A8; color: inherit; border-radius: 3px; padding: 0 1px; }
  mark.hl.cur { background: #F7B500; color: #1E1F22; }

  /* raw-text match navigator */
  .raw-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .raw-count { font-size: 12.5px; color: var(--muted); font-weight: 600; margin-right: 4px; }
  .raw-nav .btn { width: 34px; padding: 0; justify-content: center; font-size: 17px; }

  /* "context" button + callout */
  .ctx-btn {
    border: 1px solid var(--accent-tint-border); background: var(--accent-tint-bg); color: var(--accent-deep);
    font-family: var(--font); font-size: 10.5px; font-weight: 700; letter-spacing: .3px;
    padding: 1px 7px; border-radius: var(--r-pill); cursor: pointer; vertical-align: middle;
  }
  .ctx-btn:hover { background: #E3E7FD; }
  .ctx-btn .ctx-n { opacity: .65; }
  .ctx-loc { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 7px; }
  .ctx-sentence { font-size: 13px; color: var(--text-body); line-height: 1.5; }
  /* nav pinned at top; fixed callout size so it never moves while clicking through */
  .context-callout.fixed { width: 380px; max-width: 380px; }
  .context-callout .ctx-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding-bottom: 9px; border-bottom: 1px solid var(--hairline); }
  .context-callout .ctx-nav .btn { width: 34px; padding: 0; justify-content: center; font-size: 17px; }
  .ctx-count { font-size: 12.5px; font-weight: 700; color: var(--text-body); }
  .context-callout.fixed .ctx-content { height: 130px; overflow: auto; }

  /* ---- Two pill rows (general / engineering) --------------------------- */
  .pill-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
  .pill-row-label {
    font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--text-primary); width: 84px; flex: none;
  }

  /* ---- Two-column location table (value | where it was found) ---------- */
  .kv { border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden; }
  .kv-row {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 9px 14px; border-top: 1px solid var(--hairline);
  }
  .kv-row:first-child { border-top: none; }
  .kv-row:nth-child(odd) { background: var(--n1); }
  .kv-val { flex: 1; font-family: var(--mono); font-size: 13px; color: var(--text-primary); word-break: break-all; }
  .kv-loc {
    flex: none; font-size: 12px; color: var(--muted); font-weight: 600;
    white-space: nowrap; padding-top: 1px;
  }
  .kv-loc .more { color: var(--faint-2); font-weight: 500; }
  .kv-loc .more-link { color: var(--accent); cursor: pointer; }
  .kv-loc .more-link:hover { color: var(--accent-deep); text-decoration: underline; }

  /* Callout / popover listing every occurrence of a deduped value */
  .callout {
    position: absolute; z-index: 60; min-width: 240px; max-width: 420px;
    max-height: 320px; overflow: auto;
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(30,31,34,.14); padding: 11px 13px;
    animation: calloutIn .16s ease-out;
  }
  .callout-head { font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--text-primary); word-break: break-all; margin-bottom: 8px; padding-bottom: 7px; border-bottom: 1px solid var(--hairline); }
  .callout-list { display: flex; flex-direction: column; gap: 5px; }
  .callout-row { display: flex; gap: 10px; font-size: 12.5px; color: var(--text-body); }
  .callout-idx { color: var(--faint-2); min-width: 26px; flex: none; }
  .tloc { color: var(--muted); font-weight: 500; font-size: 12.5px; }
  .kv-head { display: flex; gap: 14px; padding: 7px 14px; background: var(--n2); border-bottom: 1px solid var(--border); }
  .kv-head span { font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
  .kv-head .h-val { flex: 1; }
  .kv-head .sortable { cursor: pointer; user-select: none; }
  .kv-head .sortable:hover { color: var(--text-body); }

  /* Parameters lens — sortable value/unit table */
  table.ptable { border-collapse: collapse; width: 100%; font-size: 13px; border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden; }
  table.ptable th, table.ptable td { padding: 8px 12px; text-align: left; border-top: 1px solid var(--hairline); }
  table.ptable thead th { background: var(--n2); color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; border-top: none; white-space: nowrap; }
  table.ptable thead th.sortable { cursor: pointer; user-select: none; }
  table.ptable thead th.sortable:hover { color: var(--text-body); background: var(--n3); }
  table.ptable tbody tr:nth-child(even) td { background: var(--n1); }
  table.ptable .p-num { font-family: var(--mono); font-weight: 600; color: var(--text-primary); text-align: right; white-space: nowrap; width: 1%; }
  table.ptable .p-unit { font-family: var(--mono); color: var(--text-body); white-space: nowrap; }
  table.ptable .p-loc { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }

  /* ---- Results panel --------------------------------------------------- */
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .panel-title { display: flex; align-items: baseline; gap: 10px; }
  .panel-title h2 { margin: 0; font-size: 17px; font-weight: 700; color: var(--heading); }
  .panel-title .count { font-size: 13px; color: var(--muted); font-weight: 600; }
  .panel-actions { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; }

  select.fmt {
    height: 34px; padding: 0 10px;
    border: 1px solid #C7CAD1; border-radius: var(--r-btn);
    background: #fff; color: var(--text-body); font-size: 13px; font-family: var(--font);
    cursor: pointer; outline: none;
  }
  select.fmt:focus { border-color: var(--accent); }

  /* raw text */
  pre.raw {
    margin: 0; max-height: 460px; overflow: auto; position: relative;
    border: 1px solid var(--border); border-radius: var(--r-card);
    padding: 16px; background: var(--n1);
    font-family: var(--mono); font-size: 12.5px; color: var(--text-primary);
    white-space: pre-wrap; word-break: break-word;
  }

  /* image gallery */
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .img-card { border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden; background: #fff; }
  .img-card .thumb {
    height: 130px; background: var(--n2); cursor: zoom-in;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .img-card .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; transition: transform .15s; }
  .img-card .thumb:hover img { transform: scale(1.04); }

  /* Lightbox (full-size image viewer) */
  .lightbox { position: fixed; inset: 0; z-index: 100; background: rgba(20,21,24,.88); display: flex; align-items: center; justify-content: center; animation: calloutIn .15s ease-out; }
  .lb-img { max-width: 90vw; max-height: 86vh; object-fit: contain; border-radius: 6px; background: #fff; box-shadow: 0 16px 60px rgba(0,0,0,.55); cursor: default; }
  .lb-btn {
    position: fixed; border: none; background: rgba(255,255,255,.13); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background .12s; line-height: 1;
  }
  .lb-btn:hover { background: rgba(255,255,255,.26); }
  .lb-nav { top: 50%; transform: translateY(-50%); width: 52px; height: 52px; border-radius: 50%; font-size: 30px; font-weight: 700; }
  .lb-prev { left: 18px; } .lb-next { right: 18px; }
  .lb-close { top: 16px; right: 18px; width: 40px; height: 40px; border-radius: 50%; font-size: 24px; }
  .lb-caption { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; color: #fff; font-size: 13px; font-weight: 600; opacity: .92; pointer-events: none; }
  .lb-caption .lb-counter { opacity: .7; }
  .img-card .img-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--hairline); }
  .img-card .img-name { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* tables — master/detail (compact list, lots of room for the table) */
  .tbl-layout { display: flex; gap: 14px; align-items: flex-start; }
  .tbl-side { width: 170px; flex: none; display: flex; flex-direction: column; gap: 4px; }
  .tbl-list { display: flex; flex-direction: column; gap: 4px; max-height: 560px; overflow: auto; }
  .tbl-item {
    text-align: left; border: 1px solid var(--border); border-radius: 7px; background: #fff;
    padding: 5px 8px; cursor: pointer; font-family: var(--font);
    display: flex; flex-direction: column; gap: 1px;
  }
  .tbl-item:hover { background: var(--n1); border-color: var(--faint-2); }
  .tbl-item.active { background: var(--accent-tint-bg); border-color: var(--accent-tint-border); }
  .tbl-item-name { font-size: 11.5px; font-weight: 600; color: var(--text-primary); line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tbl-item.active .tbl-item-name { color: var(--accent-deep); }
  .tbl-item-loc { font-size: 10px; color: var(--muted); font-weight: 500; }
  .tbl-detail { flex: 1; min-width: 0; }
  .tbl-empty { font-size: 13px; color: var(--muted); padding: 12px 4px; }
  .ai-status { display: flex; align-items: center; gap: 10px; padding: 18px; border: 1px solid var(--accent-tint-border); background: var(--accent-tint-bg); border-radius: var(--r-card); font-size: 14px; font-weight: 600; color: var(--accent-deep); }
  @media (max-width: 720px) { .tbl-layout { flex-direction: column; } .tbl-side { width: 100%; } }

  /* tables — single table view */
  .tbl-wrap { margin-bottom: 22px; }
  .tbl-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .tbl-head .tname { font-weight: 700; color: var(--text-primary); font-size: 13px; }
  .tbl-scroll { overflow: auto; border: 1px solid var(--border); border-radius: var(--r-card); max-height: 460px; }
  /* width:auto so each column hugs its longest cell (no stretched dead space) */
  table.data { border-collapse: collapse; width: auto; max-width: 100%; font-size: 11.5px; line-height: 1.25; }
  table.data td, table.data th { border: 1px solid var(--hairline); padding: 2px 6px; text-align: left; white-space: nowrap; color: var(--text-primary); }
  table.data tr:first-child td { background: var(--n2); font-weight: 700; position: sticky; top: 0; }

  /* empty / placeholder states */
  .empty {
    text-align: center; padding: 48px 20px; color: var(--muted);
    border: 1px dashed var(--border); border-radius: var(--r-card); background: var(--n1);
  }
  .empty .big { font-size: 15px; color: var(--text-body); font-weight: 600; margin-bottom: 4px; }

  /* ---- Toasts ---------------------------------------------------------- */
  #toasts {
    position: fixed; right: 18px; bottom: 18px;
    display: flex; flex-direction: column; gap: 10px; z-index: 50; max-width: 360px;
  }
  .toast {
    border: 1px solid var(--border); border-left-width: 3px;
    border-radius: 10px; background: #fff; padding: 11px 14px;
    font-size: 13px; color: var(--text-body);
    box-shadow: 0 6px 24px rgba(30,31,34,.10);
    animation: calloutIn .18s ease-out;
  }
  .toast.error { border-left-color: var(--danger); }
  .toast.warn  { border-left-color: var(--warning); }
  .toast.ok    { border-left-color: var(--success); }
  .toast .t-title { font-weight: 700; color: var(--text-primary); display: block; margin-bottom: 1px; }

  @keyframes calloutIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  /* small spinner for processing state */
  .spin { width: 13px; height: 13px; border: 2px solid var(--n3); border-top-color: var(--accent); border-radius: 50%; display: inline-block; animation: sp .7s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }
</style>
</head>
<body>

</div>

<div id="toasts"></div>

<script>
/* ============================================================================
   0. CDN LIBRARY LOADER (lazy)
   Each parser library is fetched only the first time a format needs it. This
   keeps initial open instant and minimizes network traffic to the CDN.
   ========================================================================== */
const LIBS = {
  pdfjs:   'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfWork: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  mammoth: 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',
  xlsx:    'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  papa:    'https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js',
  jszip:   'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
};

const LIB_TIMEOUT_MS = 25000; // a CDN script that never loads (offline / blocked) must not hang forever

const _loaded = {};
function loadScript(url) {
  if (_loaded[url]) return _loaded[url];
  _loaded[url] = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url;
    s.async = true;
    // Watchdog: a blocked/offline CDN often never fires onerror, so we bail out ourselves.
    const timer = setTimeout(() => {
      fail(new Error('Timed out loading a library from the CDN (' + url.split('/').pop() +
        '). You may be offline or the CDN is blocked — this tool needs internet on first use of PDF/DOCX/XLSX/CSV files.'));
    }, LIB_TIMEOUT_MS);
    const done = () => { clearTimeout(timer); };
    const fail = (err) => { done(); delete _loaded[url]; s.remove(); reject(err); }; // allow a later retry
    s.onload = () => { done(); resolve(); };
    s.onerror = () => fail(new Error('Could not load a library from the CDN (' + url.split('/').pop() + '). Check your connection.'));
    document.head.appendChild(s);
  });
  return _loaded[url];
}

async function ensurePdfjs() {
  await loadScript(LIBS.pdfjs);
  // PDF.js renders/parses on its own worker thread => keeps our page responsive.
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfWork;
}

/* ============================================================================
   1. SMALL UTILITIES
   ========================================================================== */
const $  = (sel) => document.querySelector(sel);
const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  Object.assign(n, props);
  for (const k of kids) n.append(k);
  return n;
};
const microYield = () => new Promise(r => setTimeout(r, 0)); // hand control back to the UI
const fmtBytes = (b) => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(1) + ' MB';

// Inline icons (Feather-style) for compact icon-only buttons.
const ICONS = {
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
};
function iconBtn(kind, title, onclick, cls = 'btn-secondary') {
  const b = el('button', { className: 'btn ' + cls + ' sm btn-icon', title, onclick });
  b.innerHTML = ICONS[kind]; // static, trusted markup
  return b;
}

/*
  No-progress watchdog. Runs `task`, handing it a `beat()` function. Every call
  to beat() means "I'm still making progress" and resets the timer. If no beat
  (and no completion) happens within `ms`, the task is rejected so the UI can
  surface an error instead of spinning forever. Long-but-progressing work (e.g.
  a big multi-page PDF) keeps beating and is never killed; a truly stuck parse
  (hung CDN load, corrupt file) trips the watchdog.
*/
const STALL_TIMEOUT_MS = 30000;
function withWatchdog(label, task, ms = STALL_TIMEOUT_MS) {
  return new Promise((resolve, reject) => {
    let timer, settled = false;
    const stop = () => { settled = true; clearTimeout(timer); };
    const beat = () => {
      if (settled) return;
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (settled) return;
        settled = true;
        reject(new Error(label + ' stalled — no progress for ' + Math.round(ms / 1000) +
          's. The file may be too large or corrupt, or a CDN library is blocked. Aborting.'));
      }, ms);
    };
    beat(); // arm
    Promise.resolve(task(beat)).then(
      (v) => { if (!settled) { stop(); resolve(v); } },
      (e) => { if (!settled) { stop(); reject(e); } }
    );
  });
}

function toast(msg, kind = 'ok', title = '', duration = 4200) {
  const t = el('div', { className: 'toast ' + kind, title: 'Click to dismiss' });
  if (title) t.append(el('span', { className: 't-title', textContent: title }));
  t.append(document.createTextNode(msg));
  const dismiss = () => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); };
  t.addEventListener('click', dismiss);
  $('#toasts').append(t);
  setTimeout(dismiss, duration);
}

/* ============================================================================
   2. EXTRACTION PATTERNS (the text sieves)
   Each returns matches via a global-flagged regex. A `clean` step trims junk.
   ========================================================================== */
const PATTERNS = {
  emails: {
    re: /[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/g,
  },
  links: {
    re: /\b(?:https?:\/\/|www\.)[^\s"'<>)\]}]+/gi,
    clean: (s) => s.replace(/[.,;:!?'")\]]+$/, ''), // strip trailing sentence punctuation
  },
  dates: {
    re: new RegExp([
      '\\b\\d{4}-\\d{2}-\\d{2}\\b',                                   // 2024-06-23 (ISO)
      '\\b\\d{1,2}[\\/\\-.]\\d{1,2}[\\/\\-.]\\d{2,4}\\b',             // 23/06/2024, 6-23-24
      '\\b\\d{1,2}\\s(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\\.?\\s\\d{2,4}\\b', // 23 June 2024
      '\\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\\.?\\s\\d{1,2},?\\s\\d{2,4}\\b', // June 23, 2024
    ].join('|'), 'gi'),
  },
  money: {
    re: new RegExp([
      '(?:A\\$|US\\$|NZ\\$|\\$|€|£|¥)\\s?\\d[\\d,]*(?:\\.\\d{1,2})?', // $1,234.56 / A$50
      '\\d[\\d,]*(?:\\.\\d{1,2})?\\s?(?:AUD|USD|EUR|GBP|NZD|JPY)\\b',  // 1,234.56 AUD
    ].join('|'), 'gi'),
  },
};

/* Phone numbers — Australian-first (default) and an International loose mode. */
const PHONE_AU = new RegExp([
  '\\+61\\s?4\\d{2}\\s?\\d{3}\\s?\\d{3}',          // +61 4xx xxx xxx (mobile, intl)
  '\\+61\\s?[2378]\\s?\\d{4}\\s?\\d{4}',           // +61 x xxxx xxxx (landline, intl)
  '\\b04\\d{2}\\s?\\d{3}\\s?\\d{3}\\b',            // 04xx xxx xxx (mobile)
  '\\b0[2378]\\s?\\d{4}\\s?\\d{4}\\b',             // 0x xxxx xxxx (landline)
  '\\b1[38]00\\s?\\d{3}\\s?\\d{3}\\b',             // 1300 / 1800 xxx xxx
  '\\b13\\s?\\d{2}\\s?\\d{2}\\b',                  // 13 xx xx
].join('|'), 'g');

/* ----------------------------------------------------------------------------
   ENGINEERING SIEVES (Engineering tab)
   These are best-effort by nature — engineering notation is irregular, so each
   pattern trades some noise for coverage. Tweak the regexes/lists to taste.
   -------------------------------------------------------------------------- */

// Units used by the Parameters sieve. Longer/:more-specific first so e.g. "kPa"
// wins over "Pa", and compound units (m/s, m³/h) match before bare ones.
const ENG_UNITS = [
  'kg/m³','kg/m3','m³/h','m3/h','Nm³/h','L/min','L/s','m/s²','m/s2','m/s','km/h','t/h','kg/h','kg/s',
  'kPa','MPa','GPa','hPa','mbar','bar','psi','atm','mmHg','Pa',
  'kWh','MWh','GWh','kW','MW','GW','VA','kVA','MVA','W',
  'mA','kA','kV','mV','µV','A','V','Ω','ohm','µF','nF','pF','mH','µH',
  'GHz','MHz','kHz','Hz','rpm','dB','dBA',
  'mm²','mm2','cm²','cm2','m²','m2','mm³','mm3','cm³','cm3','m³','m3',
  'nm','µm','um','mm','cm','km','m','in','ft','yd','mil',
  'mg','µg','kg','kt','g','t','lb','oz',
  'mL','µL','kL','ML','L','gal',
  'GPa','kN','MN','N','Nm','kNm',
  '°C','°F','°K','K','°',
  'kJ','MJ','GJ','J','cal','kcal','BTU',
  'ppm','ppb','pH','cSt','cP','lux','lm','cd','mol','%RH','%','vol%',
].map(u => u.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');

const ENG = {
  // Formulas: an equation that has an operator on the RHS (e.g. e = mc^2,
  // P = F/A), or a standalone power term (mc^2, x^2). Best-effort.
  formulas: {
    re: new RegExp([
      '[A-Za-z0-9_)\\]]\\s*=\\s*[A-Za-z0-9_.\\s()]*[\\^*/+][A-Za-z0-9_.\\s()^*/+\\-]*', // var = ...op...
      '[A-Za-z0-9_)\\]]\\^[A-Za-z0-9_(+\\-]+',                                          // base^exp
    ].join('|'), 'g'),
    clean: (s) => s.trim().replace(/\s+/g, ' '),
  },
  // Parameters: a number followed by a known unit (50 kPa, 3.5 mm, 415V).
  // The leading "-" in the lookbehind stops it grabbing "101A" out of tag P-101A.
  parameters: {
    re: new RegExp('(?<![\\w.\\-])[-+]?\\d[\\d,]*(?:\\.\\d+)?\\s?(?:' + ENG_UNITS + ')(?![\\w])', 'g'),
    clean: (s) => s.trim().replace(/\s+/g, ' '),
  },
  // Standards & Codes: AS2419.1, AS/NZS 3000, ISO 9001, IEC 61511, ASME B31.3…
  // The optional [A-Z]{0,2} before the digits catches lettered codes (B31.3, Z535).
  standards: {
    re: /\b(?:AS\/NZS|ISO\/IEC|AS|ISO|IEC|IEEE|ASME|ASTM|API|ANSI|AHRI|NFPA|DIN|EN|BS|NACE|AWS|NZS|SAA)\s?[A-Z]{0,2}\d+(?:[.\-]\d+)*(?:\s?:\s?\d{4})?\b/g,
  },
  // Acronyms: 2–6 uppercase letters (HAZOP, PLC, HVAC). The lookarounds exclude
  // letters that are part of a tag/standard/doc number (HE-301, AS/NZS, PID-PR);
  // common English words are filtered out below.
  acronyms: {
    re: /(?<![\w\-/])[A-Z]{2,6}(?![\w\-/])/g,
    keep: (s) => !ACRONYM_STOPLIST.has(s),
  },
  // NB: Equipment Tags + Document Numbers are handled by collectCodes() below,
  // not by a simple regex — they need structural classification.
};

/* ----------------------------------------------------------------------------
   EQUIPMENT TAGS + DOCUMENT NUMBERS
   These share a shape (alphanumeric groups joined by hyphens) and, in PDF text,
   often come out with spaces around the hyphens ("226 - ZM - 001"). So we match
   the whole hyphen chain (spaces allowed), canonicalise it (strip the spaces),
   then classify it by structure:
     • equipment tag   AREA-TYPE-NUM (226-ZM-001) or TYPE-NUM (TIT-642, P-101A)
     • document number longer chains (P027A-000-MEM-ME-002, 2233-MDSP-091)
   Spaceless instrument tags (TT601, TE614A) are caught by a small prefix list.
   -------------------------------------------------------------------------- */
const INSTR_PREFIX = 'TIT|TICV|TIC|TCV|TE|TT|TC|PIT|PIC|PCV|PT|FIT|FIC|FCV|FT|LIT|LIC|LCV|LT|AIT|AT';

function classifyCode(groups) {
  const joined = groups.join('');
  if (!/\d/.test(joined)) return null;        // codes contain a digit
  if (!/[A-Z]/.test(joined)) return null;     // …and an uppercase letter
  if (/[a-z]/.test(joined)) return null;      // reject prose (side-by-side, air-cooled)
  if (groups.some(g => g.length > 8)) return null;
  const n = groups.length;
  if (n >= 4) return 'doc';
  if (n === 3) {
    const [a, b, c] = groups;
    if (/^\d+$/.test(a) && /^[A-Z]+$/.test(b) && /^\d+[A-Z]?$/.test(c)) return b.length <= 3 ? 'tag' : 'doc';
    return 'doc';
  }
  if (n === 2) {
    const [a, b] = groups;
    if (/^[A-Z]+$/.test(a) && /^\d+[A-Z]?$/.test(b)) return 'tag'; // TIT-642, P-101A
    return null;
  }
  return null;
}

function collectCodes(text) {
  const tags = [], docnums = [];
  let m;
  const chainRe = /[A-Za-z0-9]{1,8}(?:[ ]?[-–][ ]?[A-Za-z0-9]{1,8}){1,}/g;
  while ((m = chainRe.exec(text)) !== null) {
    const canon = m[0].replace(/\s*[-–]\s*/g, '-');
    const cls = classifyCode(canon.split('-'));
    if (cls === 'tag') tags.push({ value: canon, index: m.index });
    else if (cls === 'doc') docnums.push({ value: canon, index: m.index });
  }
  const instrRe = new RegExp('\\b(?:' + INSTR_PREFIX + ')\\d{2,4}[A-Z]?\\b', 'g');
  while ((m = instrRe.exec(text)) !== null) tags.push({ value: m[0], index: m.index });
  return { tags, docnums };
}

// Plain uppercase words that are not acronyms — filtered from the Acronyms lens.
const ACRONYM_STOPLIST = new Set(
  ('THE AND FOR ARE BUT NOT YOU ALL ANY CAN HAD HER WAS ONE OUR OUT GET HAS HIM HIS HOW MAN NEW NOW ' +
   'OLD SEE TWO WAY WHO DID ITS LET PUT SAY SHE TOO USE WITH FROM THIS THAT THEY HAVE WILL YOUR WHAT ' +
   'WHEN WHICH THERE THEIR ABOUT WOULD THESE OTHER BEEN MORE ALSO INTO ONLY OVER SUCH THAN THEM THEN ' +
   'WERE EACH MOST SOME TIME VERY WELL ITEM PAGE NOTE TBC TBA YES NO OK NA ' +
   'ONE TWO THREE FOUR FIVE SIX SEVEN EIGHT NINE TEN ZERO ' +
   'LIST CASE PLAN SCOPE LOAD DUTY FLOW RATE BASE TYPE UNIT AREA DATA NAME DATE SITE COST PURPOSE').split(/\s+/)
);

/* ============================================================================
   3. FORMAT ROUTER + PARSERS
   Every parser resolves to the normalized shape:
     { text, images:[{name,blob}], tables:[{name,rows}] }
   ========================================================================== */
function detectFormat(file) {
  const name = file.name.toLowerCase();
  const ext = name.slice(name.lastIndexOf('.') + 1);
  if (['txt','csv','json','html','htm','xml','md','log','text'].includes(ext)) return ext === 'htm' ? 'html' : ext;
  if (ext === 'pdf') return 'pdf';
  if (ext === 'docx') return 'docx';
  if (ext === 'xlsx') return 'xlsx';
  if (ext === 'doc') return 'doc-legacy';   // explicitly out of scope
  return 'unknown';
}

async function readAsText(file)        { return await file.text(); }
async function readAsArrayBuffer(file) { return await file.arrayBuffer(); }

/* --- Plain text family ------------------------------------------------- */
async function parsePlain(file) {
  const raw = await readAsText(file);
  return { sieveText: raw, displayText: raw, images: [], tables: [] };
}

/* --- HTML: strip tags for display, but sieve the raw markup (catches hrefs) */
async function parseHtml(file) {
  const raw = await readAsText(file);
  const doc = new DOMParser().parseFromString(raw, 'text/html');
  const clean = (doc.body ? doc.body.innerText : doc.documentElement.textContent) || '';
  return { sieveText: raw + '\n' + clean, displayText: clean.trim(), images: [], tables: [] };
}

/* --- CSV via PapaParse -> one table + flattened text ------------------- */
async function parseCsv(file) {
  await loadScript(LIBS.papa);
  const raw = await readAsText(file);
  const parsed = window.Papa.parse(raw.trim(), { skipEmptyLines: true });
  const rows = parsed.data;
  const tables = rows.length ? [{ name: file.name, rows }] : [];
  return { sieveText: raw, displayText: raw, images: [], tables };
}

/* --- JSON: pretty-print for display, sieve the raw ---------------------- */
async function parseJson(file) {
  const raw = await readAsText(file);
  let display = raw;
  try { display = JSON.stringify(JSON.parse(raw), null, 2); } catch (_) { /* leave as-is */ }
  return { sieveText: raw, displayText: display, images: [], tables: [] };
}

/* --- PDF via PDF.js: text + embedded images ---------------------------- */
async function parsePdf(file, beat = () => {}) {
  await ensurePdfjs();
  beat();
  const data = await readAsArrayBuffer(file);
  let pdf;
  try {
    pdf = await window.pdfjsLib.getDocument({ data }).promise;
  } catch (e) {
    if (e && e.name === 'PasswordException') throw new Error('This PDF is password-protected and can’t be opened.');
    throw e;
  }
  beat();
  let text = '';
  const pages = [];            // per-page text — drives the page number in locations
  const images = [];
  const tables = [];
  let tableCount = 0;
  const seen = new Set();

  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    beat(); // each page is progress — resets the no-progress watchdog

    // --- text layer ---
    const content = await page.getTextContent();
    const pageText = content.items.map(i => i.str).join(' ');
    pages.push(pageText);
    text += pageText + '\n';

    // --- tables: reconstruct from text geometry (positions) ---
    try {
      const viewport = page.getViewport({ scale: 1 });
      extractPdfTables(content, viewport).forEach((tbl) => {
        // Short, friendly name if the table has an obvious caption; else "Table N".
        const n = ++tableCount;
        tables.push({ name: tbl.name || `Table ${n}`, rows: tbl.rows, page: p });
      });
    } catch (_) { /* table reconstruction is best-effort */ }

    // --- embedded images: walk the operator list for image paints ---
    try {
      const ops = await page.getOperatorList();
      const OPS = window.pdfjsLib.OPS;
      for (let i = 0; i < ops.fnArray.length; i++) {
        const fn = ops.fnArray[i];
        if (fn === OPS.paintImageXObject || fn === OPS.paintJpegXObject || fn === OPS.paintImageXObjectRepeat) {
          const objName = ops.argsArray[i][0];
          // 'g_'-prefixed images are global (shared across pages) — dedupe by name
          // alone so we don't grab the same logo on every page.
          const key = objName.startsWith('g_') ? objName : (p + ':' + objName);
          if (seen.has(key)) continue;
          seen.add(key);
          const blob = await pdfImageToBlob(page, objName);
          beat(); // image decode is progress
          if (blob) images.push({ name: `p${p}-${objName}.png`, blob, page: p });
        }
      }
    } catch (_) { /* image extraction is best-effort */ }

    await microYield(); // never block the UI between pages
  }

  if (!text.trim() && pdf.numPages > 0) {
    toast('This PDF has no extractable text layer (it may be scanned images). OCR is not included in v1.', 'warn', file.name);
  }
  return { sieveText: text, displayText: text.trim(), images, tables, pages };
}

/*
  Reconstruct tables from a PDF page's text geometry. PDFs have no "table"
  concept in the text layer — only positioned text — so this is heuristic:
    1. Group text items into rows by their Y position.
    2. Find recurring X "column anchors" (x-starts shared by several rows).
    3. Assign each row's items to the nearest column.
    4. Keep only runs of >=3 consecutive multi-column rows that contain at
       least one mostly-numeric column. That numeric guard is what separates a
       real data table (invoice line items, prices) from multi-column prose,
       which would otherwise masquerade as a table.
  It will miss borderless or irregular tables — full reconstruction is hard —
  but reliably catches clean grids like quotes/invoices.
*/
const _isNumericCell = (s) => /^[-+(]?\$?\s?\d[\d,]*\.?\d*\)?%?$/.test(s.trim());

// A "prose" row has a cell that reads like a sentence (many words, mostly
// lowercase) — a wrapped paragraph that flowed through the grid. Table cells are
// values or Title-Case labels, so they don't trip this.
function isProseRow(cells) {
  for (const c of cells) {
    if (!c) continue;
    const words = c.trim().split(/\s+/);
    if (words.length >= 6 && words.filter(w => /^[a-z]/.test(w)).length / words.length > 0.5) return true;
  }
  return false;
}
// A caption row holds the table's title ("Table 3-1 …") — already the table name.
function isCaptionRow(cells) {
  return /\bTable\s*\d+\s*[-–]\s*\d+/i.test(cells.join(' '));
}

// Gap-based column detection: a real column boundary is a vertical band of
// whitespace ("river") that stays empty across most rows. Far more robust than
// guessing from text start positions — it keeps "2.5 Mtpa (Current)" as one cell
// and only splits where there's a genuine gap. `rowItems` is an array of rows,
// each an array of { x, right, s } text fragments.
function gapColumns(rowItems) {
  let minX = Infinity, maxX = -Infinity;
  for (const r of rowItems) for (const it of r) { minX = Math.min(minX, it.x); maxX = Math.max(maxX, it.right); }
  if (!isFinite(minX)) return null;
  const BIN = 2, nb = Math.ceil((maxX - minX) / BIN) + 1, cov = new Float64Array(nb), nr = rowItems.length;
  for (const r of rowItems) {
    const mk = new Uint8Array(nb);
    for (const it of r) { const a = Math.max(0, Math.floor((it.x - minX) / BIN)), b = Math.ceil((it.right - minX) / BIN); for (let i = a; i < b && i < nb; i++) mk[i] = 1; }
    for (let i = 0; i < nb; i++) cov[i] += mk[i];
  }
  // A separator is a band empty in most rows. The 0.30 threshold lets a gap that
  // is only bridged by a column-spanning header (e.g. "Connected Load" sitting
  // over the kW and P.F. columns) still count as a real column boundary.
  const thr = Math.max(1, nr * 0.30), minGap = Math.ceil(8 / BIN), seps = [];
  let i = 0;
  while (i < nb) {
    if (cov[i] < thr) { let j = i; while (j < nb && cov[j] < thr) j++; if (j - i >= minGap) seps.push(minX + ((i + j) / 2) * BIN); i = j; }
    else i++;
  }
  const bounds = [minX - 1, ...seps, maxX + 1], ranges = [];
  for (let k = 0; k < bounds.length - 1; k++) ranges.push([bounds[k], bounds[k + 1]]);
  return ranges;
}
function assignToColumns(items, ranges) {
  const out = ranges.map(() => []);
  for (const it of items) { let ci = ranges.findIndex(([a, b]) => it.x >= a && it.x < b); if (ci < 0) ci = ranges.length - 1; out[ci].push(it); }
  return out.map(a => a.sort((p, q) => p.x - q.x).map(t => t.s).join(' ').trim());
}
// Remove columns that are empty in every row (pure gap artifacts).
function dropEmptyColumns(grid) {
  if (!grid.length) return grid;
  const nc = Math.max(...grid.map(r => r.length));
  const keep = [];
  for (let c = 0; c < nc; c++) if (grid.some(r => r[c])) keep.push(c);
  return keep.length === nc ? grid : grid.map(r => keep.map(c => r[c] || ''));
}

/*
  Reconstruct tables from a PDF page's text geometry. Hybrid approach:
    1. Group text into rows by Y.
    2. Use clustered x-start "anchors" only to decide which rows are table-like
       (>= 2 columns) and group those into vertical blocks.
    3. Drop prose + caption rows from each block.
    4. Detect real columns from the whitespace gaps in the block's own rows.
    5. Keep blocks of >= 3 rows that have a mostly-numeric column.
  Borderless tables are inherently imperfect, but this keeps cells intact and
  avoids the dead-column/split-cell mess of pure anchor mapping.
*/
function extractPdfTables(content, viewport) {
  const items = content.items
    .filter(i => i.str.trim())
    .map(i => ({ s: i.str.trim(), x: i.transform[4], right: i.transform[4] + (i.width || 0), y: Math.round(viewport.height - i.transform[5]) }));
  if (items.length < 6) return [];

  // rows by Y (3px tolerance)
  items.sort((a, b) => a.y - b.y || a.x - b.x);
  const rows = [];
  let cur = null;
  for (const it of items) {
    if (!cur || Math.abs(it.y - cur.y) > 3) { cur = { y: it.y, its: [it] }; rows.push(cur); }
    else cur.its.push(it);
  }

  // x-anchors (just to judge "is this a table row") — cluster x-starts seen >= 3 rows
  const xs = [];
  for (const r of rows) if (r.its.length >= 2) for (const it of r.its) xs.push(it.x);
  xs.sort((a, b) => a - b);
  const clusters = [];
  for (const x of xs) { const last = clusters[clusters.length - 1]; if (last && x - last.sum / last.n <= 26) { last.sum += x; last.n++; } else clusters.push({ sum: x, n: 1 }); }
  const anchors = clusters.filter(c => c.n >= 3).map(c => Math.round(c.sum / c.n));
  const filledCount = (r) => {
    const hit = new Set();
    for (const it of r.its) { let bi = 0, bd = Infinity; anchors.forEach((cx, i) => { const d = Math.abs(it.x - cx); if (d < bd) { bd = d; bi = i; } }); if (bd < 26) hit.add(bi); }
    return hit.size;
  };

  // group consecutive table rows (>= 2 anchor columns), Y-gap <= 22
  const blocks = [];
  let b = null;
  for (const r of rows) {
    if (filledCount(r) >= 2) { if (b && r.y - b.lastY <= 22) { b.rows.push(r); b.lastY = r.y; } else { b = { rows: [r], lastY: r.y }; blocks.push(b); } }
    else b = null;
  }

  const tables = [];
  for (const bl of blocks) {
    const core = bl.rows.filter(r => { const cells = r.its.map(t => t.s); return !isProseRow(cells) && !isCaptionRow(cells); });
    if (core.length < 3) continue;
    const ranges = gapColumns(core.map(r => r.its));
    if (!ranges || ranges.length < 2) continue;
    const grid = core.map(r => assignToColumns(r.its, ranges));
    let numeric = false;
    for (let ci = 0; ci < ranges.length; ci++) {
      const vals = grid.map(r => r[ci]).filter(Boolean);
      if (vals.length >= 3 && vals.filter(_isNumericCell).length / vals.length >= 0.4) { numeric = true; break; }
    }
    if (!numeric) continue;
    // Friendly name from the block's raw rows (which still include the caption).
    const name = deriveTableName(bl.rows.slice(0, 6).map(r => r.its.map(t => t.s)));
    tables.push({ rows: dropEmptyColumns(grid), name });
  }
  return tables;
}

// Best-effort short, friendly table name. Engineering docs caption tables as
// "Table 3-1  <Title>"; if we find that, use the title (trimmed to ~34 chars).
// Returns null when there's no obvious caption (caller falls back to "Table N").
function deriveTableName(rows) {
  const text = rows.slice(0, 5).map(r => (Array.isArray(r) ? r : [r]).join(' ')).join(' ').replace(/\s+/g, ' ');
  const m = text.match(/\bTable\s*\d+\s*[-–]\s*\d+\b[\s:.\-]*(.{4,60})/i);
  if (!m) return null;
  // strip any repeated "Table N - M" prefix the caption sometimes carries
  let s = m[1].replace(/^(?:Table\s*\d+\s*[-–]\s*\d+\b[\s:.\-]*)+/i, '').trim();
  if (!s) return null;
  if (s.length > 32) s = s.slice(0, 32).replace(/\s+\S*$/, '') + '…';
  return s.replace(/[\s,;:.\-]+$/, '') || null;
}

/* ============================================================================
   AI TABLE EXTRACTION (opt-in, on-demand)
   Pipeline (all local once the model weights download from the HF CDN):
     render PDF page -> Table Transformer DETECTION (table boxes)
       -> Table Transformer STRUCTURE recognition (row + column boxes)
       -> fill the grid from the PDF.js text layer (or Tesseract OCR for scans).
   This is heavier and slower than the geometry method, so it only runs when the
   user clicks the button. The whole module is isolated — failures never touch
   the default geometry tables.
   ========================================================================== */
const TRANSFORMERS_CDN = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3/+esm'; // latest 3.x, ESM
const TESSERACT_CDN    = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
const AI_RENDER_SCALE  = 2;   // page render resolution for the vision models

let _tf = null, _detPipe = null, _structPipe = null;
async function loadTransformers() {
  if (_tf) return _tf;
  const mod = await import(/* webpackIgnore: true */ TRANSFORMERS_CDN);
  mod.env.allowLocalModels = false;          // always fetch from the HF hub
  if (mod.env.backends?.onnx?.wasm) mod.env.backends.onnx.wasm.proxy = false;
  _tf = mod;
  return mod;
}
// Pick WebGPU when available (much faster), else fall back to WASM.
async function getPipelines(onStatus) {
  const tf = await loadTransformers();
  const device = (typeof navigator !== 'undefined' && navigator.gpu) ? 'webgpu' : 'wasm';
  if (!_detPipe)    { onStatus('Loading table-detection model…'); _detPipe    = await tf.pipeline('object-detection', 'Xenova/table-transformer-detection', { device }).catch(() => tf.pipeline('object-detection', 'Xenova/table-transformer-detection')); }
  if (!_structPipe) { onStatus('Loading table-structure model…'); _structPipe = await tf.pipeline('object-detection', 'Xenova/table-transformer-structure-recognition', { device }).catch(() => tf.pipeline('object-detection', 'Xenova/table-transformer-structure-recognition')); }
  return { tf, det: _detPipe, struct: _structPipe };
}

async function renderPageCanvas(page, scale) {
  const viewport = page.getViewport({ scale });
  const canvas = el('canvas'); canvas.width = Math.ceil(viewport.width); canvas.height = Math.ceil(viewport.height);
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  return { canvas, viewport };
}
const canvasToURL = (canvas) => new Promise(r => canvas.toBlob(b => r(URL.createObjectURL(b)), 'image/png'));

// OCR a cropped table image with Tesseract, returning words in PAGE pixel coords.
async function ocrWords(cropCanvas, ox, oy) {
  await loadScript(TESSERACT_CDN);
  const url = await canvasToURL(cropCanvas);
  let words = [];
  try {
    const worker = await window.Tesseract.createWorker('eng');
    const res = await worker.recognize(url, {}, { blocks: true });
    await worker.terminate();
    const collect = (w) => { if (w && w.text && w.text.trim() && w.bbox) words.push({ s: w.text.trim(), x0: w.bbox.x0 + ox, x1: w.bbox.x1 + ox, yc: (w.bbox.y0 + w.bbox.y1) / 2 + oy }); };
    if (res.data.words) res.data.words.forEach(collect);
    else if (res.data.blocks) res.data.blocks.forEach(b => b.paragraphs?.forEach(p => p.lines?.forEach(l => l.words?.forEach(collect))));
  } finally { URL.revokeObjectURL(url); }
  return words;
}

// Run the AI pipeline over one PDF File. `method` is 'text' or 'ocr'.
async function aiExtractPdf(file, method, onStatus) {
  await ensurePdfjs();
  const { det, struct } = await getPipelines(onStatus);
  const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const baseName = file.name.replace(/\.pdf$/i, '');
  const tables = [];
  let tcount = 0;

  for (let p = 1; p <= pdf.numPages; p++) {
    onStatus(`Analysing page ${p} of ${pdf.numPages}…`);
    const page = await pdf.getPage(p);
    const { canvas, viewport } = await renderPageCanvas(page, AI_RENDER_SCALE);
    const pageURL = await canvasToURL(canvas);
    let detected = [];
    try { detected = await det(pageURL, { threshold: 0.6 }); } catch (_) {} finally { URL.revokeObjectURL(pageURL); }

    // text words in page pixels (text method)
    let pageWords = null;
    if (method === 'text') {
      const Hpts = viewport.height / AI_RENDER_SCALE;
      const tc = await page.getTextContent();
      pageWords = tc.items.filter(i => i.str.trim()).map(i => ({
        s: i.str.trim(),
        x0: i.transform[4] * AI_RENDER_SCALE,
        x1: (i.transform[4] + (i.width || 0)) * AI_RENDER_SCALE,
        yc: (Hpts - i.transform[5]) * AI_RENDER_SCALE,
      }));
    }

    for (const d of detected) {
      if (!/table/i.test(d.label)) continue;
      const b = d.box;
      const x0 = Math.max(0, Math.floor(b.xmin)), y0 = Math.max(0, Math.floor(b.ymin));
      const w = Math.min(canvas.width - x0, Math.ceil(b.xmax - b.xmin)), h = Math.min(canvas.height - y0, Math.ceil(b.ymax - b.ymin));
      if (w < 30 || h < 30) continue;

      const crop = el('canvas'); crop.width = w; crop.height = h;
      crop.getContext('2d').drawImage(canvas, x0, y0, w, h, 0, 0, w, h);
      const cropURL = await canvasToURL(crop);
      let parts = [];
      try { parts = await struct(cropURL, { threshold: 0.5 }); } catch (_) {} finally { URL.revokeObjectURL(cropURL); }

      // row + column boxes, shifted from crop space back into page pixels
      const rows = parts.filter(o => /table row/i.test(o.label)).map(o => ({ y0: o.box.ymin + y0, y1: o.box.ymax + y0 })).sort((a, b) => a.y0 - b.y0);
      const cols = parts.filter(o => /table column/i.test(o.label) && !/header/i.test(o.label)).map(o => ({ x0: o.box.xmin + x0, x1: o.box.xmax + x0 })).sort((a, b) => a.x0 - b.x0);
      if (rows.length < 2 || cols.length < 1) continue;

      // words for this table
      let words = pageWords;
      if (method === 'ocr') { onStatus(`OCR on a table from page ${p}…`); words = await ocrWords(crop, x0, y0); }

      const grid = rows.map(() => cols.map(() => []));
      for (const wd of words) {
        const cx = (wd.x0 + wd.x1) / 2, cy = wd.yc;
        const ri = rows.findIndex(r => cy >= r.y0 && cy <= r.y1);
        if (ri < 0) continue;
        let ci = cols.findIndex(c => cx >= c.x0 && cx <= c.x1);
        if (ci < 0) { // nearest column if it falls in a gutter
          let bd = Infinity; cols.forEach((c, i) => { const d2 = Math.abs((c.x0 + c.x1) / 2 - cx); if (d2 < bd) { bd = d2; ci = i; } });
        }
        grid[ri][ci].push(wd);
      }
      const out = grid.map(r => r.map(cell => cell.sort((a, b) => a.x0 - b.x0).map(wd => wd.s).join(' ').trim()))
                      .filter(r => r.some(c => c)); // drop empty rows
      if (out.length < 2) continue;
      tcount++;
      tables.push({ name: `Table ${tcount}`, rows: out, page: p, source: baseName + '.pdf' });
    }
    await microYield();
  }
  return tables;
}

// Run AI extraction across all PDF sources in the pool.
async function runAiExtraction(method, onStatus) {
  const pdfs = state.sources.filter(s => s.status === 'ok' && s.file && /\.pdf$/i.test(s.name));
  if (!pdfs.length) throw new Error('AI table extraction needs a PDF — drop one first.');
  const all = [];
  for (const s of pdfs) {
    const ts = await aiExtractPdf(s.file, method, onStatus);
    ts.forEach(t => all.push({ ...t, source: s.name }));
  }
  return all;
}

// Drive the on-demand AI extraction: flip to a busy view, stream status text,
// then show the AI tables (or restore on error). Defined here; called from the
// Tables panel button.
async function startAiExtraction(method) {
  if (state.aiBusy) return;
  state.aiBusy = true; state.aiStatus = 'Starting…';
  renderPills(); renderPanel();
  const onStatus = (m) => { state.aiStatus = m; const e = document.getElementById('aiStatus'); if (e) e.textContent = m; };
  try {
    const tables = await runAiExtraction(method, onStatus);
    state.aiTables = tables;
    state.tableSel = 0;
    if (!tables.length) toast('The AI models ran but found no tables on these pages.', 'warn', 'Smart extraction');
    else toast(`AI extracted ${tables.length} table${tables.length === 1 ? '' : 's'}.`, 'ok');
  } catch (e) {
    toast(e.message || 'The model failed to load or run.', 'error', 'Smart extraction failed', 9000);
  } finally {
    state.aiBusy = false;
    renderPills(); renderPanel();
  }
}

// Pull one image object out of a PDF page and convert it to a PNG blob.
// Returns null (rather than hanging) if the object can't be resolved.
function pdfImageToBlob(page, objName) {
  return new Promise((resolve) => {
    let done = false;
    const finish = (v) => { if (!done) { done = true; resolve(v); } };

    const toBlob = (img) => {
      try {
        if (!img) return finish(null);
        const w = img.width, h = img.height;
        if (!w || !h || w * h < 64) return finish(null); // skip 1px spacers / junk
        const canvas = el('canvas'); canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        if (img.bitmap) {
          ctx.drawImage(img.bitmap, 0, 0);
        } else if (img.data) {
          const out = ctx.createImageData(w, h);
          const d = img.data, n = w * h;
          if (d.length === n * 4)      { out.data.set(d); }                                   // RGBA
          else if (d.length === n * 3) { for (let i=0,j=0;i<d.length;i+=3,j+=4){ out.data[j]=d[i]; out.data[j+1]=d[i+1]; out.data[j+2]=d[i+2]; out.data[j+3]=255; } } // RGB
          else if (d.length === n)     { for (let i=0,j=0;i<n;i++,j+=4){ out.data[j]=out.data[j+1]=out.data[j+2]=d[i]; out.data[j+3]=255; } } // grayscale (8bpp)
          else return finish(null);                                                           // packed/other => skip
          ctx.putImageData(out, 0, 0);
        } else return finish(null);
        canvas.toBlob((b) => finish(b), 'image/png');
      } catch (_) { finish(null); }
    };

    // Per-image safety timeout: some objects (e.g. inside forms) never resolve via
    // the callback. Without this, the await would hang the whole parse forever.
    setTimeout(() => finish(null), 4000);

    try {
      // 'g_'-prefixed names are GLOBAL objects on page.commonObjs; everything else
      // is on page.objs. Calling the wrong store's get() never fires its callback.
      const store = objName.startsWith('g_') ? page.commonObjs : page.objs;
      if (store.has(objName)) toBlob(store.get(objName)); // already decoded: sync
      else store.get(objName, toBlob);                    // otherwise: async callback
    } catch (_) { finish(null); }
  });
}

/* --- DOCX via mammoth: raw text + embedded images ---------------------- */
async function parseDocx(file) {
  await loadScript(LIBS.mammoth);
  const arrayBuffer = await readAsArrayBuffer(file);
  const images = [];

  // Custom image handler: collect each embedded image as a blob.
  const convertImage = window.mammoth.images.imgElement(async (image) => {
    const buf = await image.read('base64');
    const blob = base64ToBlob(buf, image.contentType || 'image/png');
    const ext = (image.contentType || 'image/png').split('/')[1] || 'png';
    images.push({ name: `image-${images.length + 1}.${ext}`, blob });
    return {}; // we don't need the HTML <img>, just the asset
  });

  const textResult = await window.mammoth.extractRawText({ arrayBuffer });
  // Run a second pass purely to trigger the image handler.
  await window.mammoth.convertToHtml({ arrayBuffer }, { convertImage });

  const text = textResult.value || '';
  return { sieveText: text, displayText: text.trim(), images, tables: [] };
}

/* --- XLSX via SheetJS: every sheet -> a table + flattened text --------- */
async function parseXlsx(file) {
  await loadScript(LIBS.xlsx);
  const data = await readAsArrayBuffer(file);
  const wb = window.XLSX.read(data, { type: 'array' });
  const tables = [];
  let text = '';
  for (const sheetName of wb.SheetNames) {
    const ws = wb.Sheets[sheetName];
    const rows = window.XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: false, defval: '' });
    if (rows.length) tables.push({ name: sheetName, rows });
    text += window.XLSX.utils.sheet_to_csv(ws) + '\n';
  }
  return { sieveText: text, displayText: text.trim(), images: [], tables };
}

// Route a single file to its parser. `beat` is the watchdog heartbeat.
async function parseFile(file, beat = () => {}) {
  const fmt = detectFormat(file);
  switch (fmt) {
    case 'txt': case 'log': case 'md': case 'xml': case 'text': return parsePlain(file);
    case 'html': return parseHtml(file);
    case 'csv':  return parseCsv(file);
    case 'json': return parseJson(file);
    case 'pdf':  return parsePdf(file, beat);
    case 'docx': return parseDocx(file);
    case 'xlsx': return parseXlsx(file);
    case 'doc-legacy':
      throw new Error('Legacy .doc is out of scope. Please re-save as .docx.');
    default:
      throw new Error('Unsupported file type. Supported: TXT, CSV, JSON, HTML, XML, MD, LOG, PDF, DOCX, XLSX.');
  }
}

/* small helpers for binary <-> blob */
function base64ToBlob(b64, type) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type });
}

/* ============================================================================
   4. APPLICATION STATE
   `sources` is the pool. 'paste' is a reserved source updated live. recompute()
   merges everything and runs the extraction layer.
   ========================================================================== */
const state = {
  sources: [],          // { id, name, status:'ok'|'busy'|'err', sieveText, displayText, images[], tables[], pages? }
  results: null,        // computed by recompute()
  active: 'rawText',    // currently selected category
  tableSel: 0,          // selected table index in the Tables lens
  filter: '',           // global filter text (applies to every lens)
  paramSort: { col: null, dir: 1 }, // Parameters lens sort: col 'value'|'unit'|'loc', dir 1 asc / -1 desc
  listSort: {},         // per-list-lens sort, keyed by category: { col:'value'|'loc', dir }
  aiTables: null,       // AI-extracted tables (null until the user runs Smart extraction)
  aiBusy: false,        // true while the AI pipeline is running
  aiStatus: '',         // latest progress message during AI extraction
};

// Definition of every category lens.
//   type: 'list' (text sieve results), 'raw' text, or structure ('images'/'tables').
//   row:  which pill row it sits in ('general' on top, 'engineering' below).
//   eg:   a tiny example shown under the label on the pill.
// Contacts merges emails + phones into a single lens.
const CATEGORIES = [
  // --- General row ---
  { key: 'contact',   label: 'Contacts',    type: 'list',   row: 'general', eg: 'e.g. name@site.com' },
  { key: 'links',     label: 'Links',       type: 'list',   row: 'general', eg: 'e.g. https://…' },
  { key: 'dates',     label: 'Dates',       type: 'list',   row: 'general', eg: 'e.g. 23/06/2026' },
  { key: 'money',     label: 'Finance',     type: 'list',   row: 'general', eg: 'e.g. $7,113.64' },
  { key: 'docnums',   label: 'Doc Numbers', type: 'list',   row: 'general', eg: 'e.g. PID-PR-K-132' },
  { key: 'acronyms',  label: 'Acronyms',    type: 'list',   row: 'general', eg: 'e.g. HAZOP' },
  { key: 'images',    label: 'Images',      type: 'images', row: 'general', eg: 'embedded pictures' },
  { key: 'tables',    label: 'Tables',      type: 'tables', row: 'general', eg: 'grids from the file' },
  { key: 'rawText',   label: 'Raw Text',    type: 'raw',    row: 'general', eg: 'full clean text' },
  // --- Engineering row ---
  { key: 'formulas',  label: 'Formulas',    type: 'list',   row: 'engineering', eg: 'e.g. e = mc²' },
  { key: 'parameters',label: 'Parameters',  type: 'list',   row: 'engineering', eg: 'e.g. 50 kPa' },
  { key: 'standards', label: 'Standards',   type: 'list',   row: 'engineering', eg: 'e.g. AS2419.1' },
  { key: 'tags',      label: 'Tags',        type: 'list',   row: 'engineering', eg: 'e.g. 226-PP-001' },
];

/* ----- run all text sieves over the merged text, chunked to stay smooth --- */
// All list categories. Each entry maps a result key to its pattern. Phones get a
// digit-count guard. Results are arrays of { value, index } where index is the
// character offset into the combined text (used to compute page + position %).
async function runSieves(text) {
  const keys = ['contact','links','dates','money','formulas','parameters','standards','docnums','tags','acronyms'];
  const empty = Object.fromEntries(keys.map(k => [k, []]));
  if (!text) return empty;

  const emails     = await collectMatches(text, PATTERNS.emails);
  const phones     = await collectMatches(text, { re: PHONE_AU, keep: s => s.replace(/\D/g, '').length >= 6 });
  const links      = await collectMatches(text, PATTERNS.links);
  const dates      = await collectMatches(text, PATTERNS.dates);
  const money      = await collectMatches(text, PATTERNS.money);
  const formulas    = await collectMatches(text, ENG.formulas);
  const parameters  = await collectMatches(text, ENG.parameters);
  const standards   = await collectMatches(text, ENG.standards);
  const acronymsRaw = await collectMatches(text, ENG.acronyms);
  const { tags, docnums } = collectCodes(text); // structural classifier

  // Drop "acronyms" that are really the letter-parts of a detected tag/doc number
  // (e.g. ZM, PP, MEM, TIT) — the spaces around hyphens in PDF text let them slip
  // through the regex's adjacency guard.
  const codeWords = new Set();
  for (const c of tags)    { c.value.split('-').forEach(g => { if (/^[A-Z]{2,}$/.test(g)) codeWords.add(g); }); const p = c.value.match(/^[A-Z]{2,}/); if (p) codeWords.add(p[0]); }
  for (const c of docnums) c.value.split('-').forEach(g => { if (/^[A-Z]{2,}$/.test(g)) codeWords.add(g); });
  const acronyms = acronymsRaw.filter(a => !codeWords.has(a.value));

  // Contact Info merges emails + phones (ordering is fixed up by the sort step).
  return { contact: [...emails, ...phones], links, dates, money, formulas, parameters, standards, docnums, tags, acronyms };
}

// Run one pattern across the whole text, recording each match's char offset.
// Yields to the UI periodically so even huge inputs never freeze the page.
async function collectMatches(text, pattern) {
  const flags = pattern.re.flags.includes('g') ? pattern.re.flags : pattern.re.flags + 'g';
  const re = new RegExp(pattern.re.source, flags); // fresh instance: own lastIndex
  const out = [];
  let m, n = 0;
  while ((m = re.exec(text)) !== null) {
    if (m.index === re.lastIndex) re.lastIndex++;   // guard against zero-length matches
    let v = m[0];
    if (pattern.clean) v = pattern.clean(v);
    v = (v || '').trim();
    if (!v) continue;
    if (pattern.keep && !pattern.keep(v)) continue;
    out.push({ value: v, index: m.index });
    if (++n % 2000 === 0) await microYield();
  }
  return out;
}

/* ----- merge pool -> run extraction -> render --------------------------- */
let recomputeToken = 0;
async function recompute() {
  const myToken = ++recomputeToken; // guard against overlapping async runs

  const ready = state.sources.filter(s => s.status === 'ok');

  // Build ONE combined text for sieving, plus a locator: a list of segments that
  // remembers where each page / source begins, so a match's offset can be turned
  // back into "Page N (X%)". PDFs contribute one segment per page; everything
  // else is a single page-less segment.
  let combined = '';
  const segments = [];
  for (const s of ready) {
    if (s.pages && s.pages.length) {
      s.pages.forEach((pt, pi) => { segments.push({ start: combined.length, page: pi + 1, source: s.name }); combined += pt + '\n'; });
    } else {
      segments.push({ start: combined.length, page: null, source: s.name });
      combined += (s.sieveText || '') + '\n';
    }
    combined += '\n'; // separator between sources
  }
  state.locator = { segments, total: Math.max(1, combined.length), multi: ready.length > 1 };
  state.combined = combined; // kept so "context" can pull the surrounding sentence

  // Raw Text: collapse any run of 3+ line breaks down to 2, so there is never
  // more than a single empty row between two blocks of text.
  const displayText = ready.map(s => s.displayText).filter(Boolean).join('\n\n— — —\n\n')
                        .replace(/[ \t]+\n/g, '\n')   // trim trailing spaces on lines
                        .replace(/\n{3,}/g, '\n\n');   // max one blank line between blocks
  // Attach the source name so image/table captions can resolve their location.
  const images = ready.flatMap(s => s.images.map(img => ({ ...img, source: s.name })));
  const tables = ready.flatMap(s => s.tables.map(t => ({ ...t, source: s.name })));

  const sieves = await runSieves(combined);
  if (myToken !== recomputeToken) return; // a newer run superseded us

  state.results = { ...sieves, rawText: displayText, images, tables };

  // Apply list options (dedupe/sort) once, store the display-ready arrays.
  state.display = {};
  for (const cat of CATEGORIES) {
    if (cat.type === 'list') state.display[cat.key] = applyListOptions(state.results[cat.key] || []);
  }

  renderPills();
  renderPanel();
  updateFilterInfo();
}

// Dedupe (case-insensitive) and order the items. Every occurrence's offset is
// kept in `indices` so the "(+N more)" callout can list them all.
// Returns [{ value, index, indices:[…] }] where index is the first occurrence.
function applyListOptions(arr) {
  let items;
  if ($('#optDedupe').checked) {
    const map = new Map();
    for (const it of arr) {
      // Whitespace-insensitive key: "100%", "100 %" and "100% " collapse to one row.
      const k = it.value.toLowerCase().replace(/\s+/g, '');
      if (map.has(k)) map.get(k).indices.push(it.index);
      else map.set(k, { value: it.value, index: it.index, indices: [it.index] });
    }
    items = [...map.values()];
  } else {
    items = arr.map(it => ({ value: it.value, index: it.index, indices: [it.index] }));
  }
  items.sort((a, b) => a.index - b.index); // default = source/document order (click headers to sort)
  return items;
}

// Turn a character offset into a human location: "Page 5 (80%)", "80%", or
// "report.pdf · Page 5 (80%)" when several sources are pooled.
function locate(index) {
  const loc = state.locator;
  if (!loc) return '';
  const pct = Math.min(100, Math.max(0, Math.round(index / loc.total * 100)));
  let seg = loc.segments[0];
  for (const s of loc.segments) { if (s.start <= index) seg = s; else break; }
  const parts = [];
  if (loc.multi && seg) parts.push(seg.source);
  if (seg && seg.page != null) parts.push('Page ' + seg.page);
  return parts.length ? parts.join(' · ') + ' (' + pct + '%)' : pct + '%';
}

// Location for an item that knows its page directly (images, tables). The % is
// the page's starting position in the document. Non-paged inputs (DOCX images,
// XLSX/CSV sheets) have no page, so we show the source name only (or nothing).
function pageLocation(source, page) {
  const loc = state.locator;
  if (!loc) return '';
  if (page != null) {
    const seg = loc.segments.find(s => s.source === source && s.page === page);
    const pct = Math.min(100, Math.max(0, Math.round((seg ? seg.start : 0) / loc.total * 100)));
    return (loc.multi ? source + ' · ' : '') + 'Page ' + page + ' (' + pct + '%)';
  }
  return loc.multi ? source : '';
}

/* ----------------------------------------------------------------------------
   GLOBAL FILTER
   Smart matching (case/space/punctuation-insensitive — "lo l" matches "lol")
   used for both filtering and highlighting. Raw Text and Images are never
   filtered out (per design): Raw Text just highlights + offers match navigation,
   Images always show.
   -------------------------------------------------------------------------- */
// Build a smart matcher from a query: case/space/punctuation-insensitive, so the
// chars must appear in order with only non-alphanumerics between them.
function buildMatcher(q) {
  const norm = (q || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  if (!norm) return null;
  const src = norm.split('').join('[^a-zA-Z0-9]*');
  return { src, test: (s) => new RegExp(src, 'i').test(s || '') };
}
function getFilter() { return buildMatcher((state.filter || '').trim()); }

// Pull the sentence around a character offset in the combined text, for "context".
function contextAround(index, matchLen) {
  const text = state.combined || '';
  if (!text) return '';
  const winStart = Math.max(0, index - 180);
  const winEnd = Math.min(text.length, index + matchLen + 180);
  const snippet = text.slice(winStart, winEnd);
  const rel = index - winStart;
  // sentence start: last . ! ? (then space) or newline before the match
  let s = 0; const before = snippet.slice(0, rel);
  let mm, re = /[.!?]\s|\n/g; while ((mm = re.exec(before)) !== null) s = mm.index + mm[0].length;
  // sentence end: first . ! ? (then space) or newline after the match
  let e = snippet.length; const after = snippet.slice(rel);
  const am = after.match(/[.!?](\s|$)|\n/); if (am) e = rel + am.index + 1;
  let out = snippet.slice(s, e).replace(/\s+/g, ' ').trim();
  if (winStart > 0 && s === 0) out = '… ' + out;
  if (winEnd < text.length && e === snippet.length) out = out + ' …';
  return out;
}

// Append `text` to `parent`, wrapping filter matches in <mark> (collected into
// `marks` if provided). Uses text nodes only — never innerHTML — so it is safe.
function appendHighlighted(parent, text, filter, marks) {
  text = text == null ? '' : String(text);
  if (!filter) { parent.append(document.createTextNode(text)); return; }
  const re = new RegExp(filter.src, 'gi');
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index === re.lastIndex) { re.lastIndex++; continue; }
    if (!m[0]) continue;
    if (m.index > last) parent.append(document.createTextNode(text.slice(last, m.index)));
    const mk = el('mark', { className: 'hl', textContent: m[0] });
    if (marks) marks.push(mk);
    parent.append(mk);
    last = m.index + m[0].length;
  }
  if (last < text.length) parent.append(document.createTextNode(text.slice(last)));
}

// Filtered list items (by value). No filter => unchanged.
function applyFilterList(items) {
  const f = getFilter();
  return f ? items.filter(it => f.test(it.value)) : items;
}
// Does a table contain the filter term anywhere (name or cells)?
function tableMatches(t, f) {
  return !f || f.test(t.name + ' ' + t.rows.map(r => (Array.isArray(r) ? r : [r]).join(' ')).join(' '));
}
// The tables currently on show: AI ones if the user ran Smart extraction, else
// the default geometry ones.
function currentTables() {
  if (state.aiTables) return state.aiTables;
  return state.results ? state.results.tables : [];
}
function filteredTables() {
  const f = getFilter();
  return currentTables().filter(t => tableMatches(t, f));
}

// How many items does a category currently hold? Drives badges + enabled state.
// With a filter active, list lenses and Tables reflect matching counts; Raw Text
// and Images are never filtered.
function countOf(key) {
  if (!state.results) return 0;
  if (key === 'rawText') return state.results.rawText ? 1 : 0;
  if (key === 'images')  return state.results.images.length;
  if (key === 'tables')  return filteredTables().length;
  return applyFilterList(state.display[key] || []).length;
}

/* ============================================================================
   5. RENDERING
   ========================================================================== */
function renderPills() {
  const wrap = $('#pills'); wrap.innerHTML = '';

  // If the active category is empty, jump to the first that has results.
  if (countOf(state.active) === 0) {
    const firstFull = CATEGORIES.find(c => countOf(c.key) > 0);
    state.active = firstFull ? firstFull.key : CATEGORIES[0].key;
  }

  // Two rows of pills: general on top, engineering below.
  for (const row of ['general', 'engineering']) {
    const rowEl = el('div', { className: 'pill-row' });
    rowEl.append(el('span', { className: 'pill-row-label', textContent: row }));
    for (const cat of CATEGORIES.filter(c => c.row === row)) {
      const n = countOf(cat.key);
      const enabled = n > 0;
      const btn = el('button', {
        className: 'pill-btn' + (state.active === cat.key && enabled ? ' active' : ''),
        disabled: !enabled,
        onclick: () => { state.active = cat.key; renderPills(); renderPanel(); },
      });
      const txt = el('span', { className: 'pill-text' });
      txt.append(el('span', { className: 'pill-label', textContent: cat.label }));
      if (cat.eg) txt.append(el('span', { className: 'pill-eg', textContent: cat.eg }));
      btn.append(txt);
      if (cat.key !== 'rawText') btn.append(el('span', { className: 'badge', textContent: String(n) }));
      rowEl.append(btn);
    }
    wrap.append(rowEl);
  }
}

function renderPanel() {
  closeCallout(); // any open occurrence popover belongs to the previous view
  closeLightbox();
  const body = $('#panelBody'); body.innerHTML = '';

  const anything = CATEGORIES.some(c => countOf(c.key) > 0);
  if (!anything) {
    body.append(el('div', { className: 'empty', innerHTML:
      '<div class="big">Nothing loaded yet</div>Paste some text or drop a file to get started.' }));
    return;
  }

  const cat = CATEGORIES.find(c => c.key === state.active);
  const n = countOf(cat.key);

  // ----- header (title + shared output controls) -----
  const head = el('div', { className: 'panel-head' });
  const title = el('div', { className: 'panel-title' });
  title.append(el('h2', { textContent: cat.label }));
  if (cat.key !== 'rawText') title.append(el('span', { className: 'count', textContent: n + (n === 1 ? ' result' : ' results') }));
  head.append(title);
  head.append(buildOutputControls(cat));
  body.append(head);

  // ----- body by type ----- (list lenses get filtered to matching items)
  if (cat.key === 'parameters')   renderParameters(body, applyFilterList(state.display[cat.key]));

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data Extractor</title>

<!--
  ============================================================================
  DATA EXTRACTOR  —  single-file, fully client-side
  ============================================================================
  Drop a file or paste text. Everything is parsed in your browser. Nothing is
  ever uploaded. The ONLY network traffic is pulling parser libraries from a
  CDN, and even those are loaded lazily (only when a format needs them).

  ARCHITECTURE (one shared spine, not three tools):
    1. INPUT LAYER     paste box + drag/drop zone (multi-file, pooled)
    2. ROUTER          detectFormat() dispatches a file to the right parser
    3. NORMALIZATION   every parser returns the same shape:
                         { name, text, images:[{name,blob}], tables:[{name,rows}] }
    4. EXTRACTION      text sieves (regex) + structure lenses (images/tables)
    5. OUTPUT LAYER    ONE implementation of Copy All / Download, reused by all

  Libraries (lazy-loaded from CDN, see LIBS below):
    PDF.js, mammoth.js, SheetJS (xlsx), PapaParse, JSZip
  ============================================================================
-->

<style>
  /* ==========================================================================
     BLURPRINT THEME — design tokens
     Feel: Discord's rounded geometry tuned for white/paper. Outline over fill,
     saturated color only in small areas.
     ========================================================================== */
  :root {
    /* Canvas / text */
    --bg: #FFFFFF;
    --heading: #1E1F22;
    --text-primary: #2E3035;
    --text-body: #4E5058;
    --text-body-2: #5C5E66;
    --muted: #80848E;
    --faint: #9A9DA5;
    --faint-2: #B5BAC1;

    /* Borders */
    --border: #E3E5E8;
    --divider: #F2F3F5;
    --hairline: #EEF0F2;

    /* Accent (blurple) */
    --accent: #5865F2;
    --accent-deep: #4752C4;
    --accent-tint-bg: #EEF0FE;
    --accent-tint-border: #E0E3FB;
    --link: #4752C4;

    /* Status */
    --success: #3BA55C;
    --warning: #E0A416;
    --danger: #D83C3E;
    --neutral: #B5BAC1;

    /* Neutral ramp */
    --n0: #FFFFFF;
    --n1: #F8F9FB;
    --n2: #F2F3F5;
    --n3: #E3E5E8;

    /* Radii */
    --r-card: 12px;
    --r-btn: 8px;
    --r-pill: 999px;

    /* Type */
    --font: 'Aptos','Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,sans-serif;
    --mono: 'Aptos Mono','Cascadia Code',ui-monospace,monospace;
  }

  * { box-sizing: border-box; }

  ::selection { background: #D9DDFB; }

  /* Always reserve space for the vertical scrollbar so switching between a
     long view (Raw Text) and a short one (Standards) never shifts the layout. */
  html { scrollbar-gutter: stable; overflow-y: scroll; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text-body);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1040px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  /* ---- Header ---------------------------------------------------------- */
  header.app {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
  }
  header.app h1 {
    font-size: 22px;
    font-weight: 800;
    color: var(--heading);
    margin: 0;
    letter-spacing: -0.2px;
  }
  .privacy {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    color: var(--muted);
    margin: 0 0 24px 0;
  }
  .dot {
    width: 9px; height: 9px;
    border-radius: var(--r-pill);
    background: var(--success);
    box-shadow: 0 0 0 3px #fff, 0 0 0 4px var(--hairline);
    flex: none;
  }

  /* ---- Section label --------------------------------------------------- */
  .label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.3px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 10px 0;
  }

  /* ---- Card ------------------------------------------------------------ */
  .card {
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    background: var(--bg);
    padding: 22px;
    margin-bottom: 18px;
  }

  /* ---- Input zone ------------------------------------------------------ */
  .dropzone {
    position: relative;
    border: 1.5px dashed var(--faint-2);
    border-radius: var(--r-card);
    background: var(--n1);
    transition: border-color .15s, background .15s;
  }
  .dropzone.dragover {
    border-color: var(--accent);
    background: var(--accent-tint-bg);
  }
  .dropzone textarea {
    width: 100%;
    min-height: 150px;
    resize: vertical;
    border: none;
    background: transparent;
    padding: 18px;
    font-family: var(--font);
    font-size: 14.5px;
    color: var(--text-primary);
    outline: none;
    display: block;
  }
  .dropzone textarea::placeholder { color: var(--faint); }

  .dz-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    border-top: 1px solid var(--hairline);
    flex-wrap: wrap;
  }
  .dz-hint { font-size: 12.5px; color: var(--muted); }

  /* ---- File chips ------------------------------------------------------ */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border);
    border-radius: var(--r-pill);
    padding: 5px 6px 5px 12px;
    font-size: 12.5px;
    color: var(--text-body);
    background: var(--bg);
  }
  .chip .chip-dot { width: 7px; height: 7px; border-radius: var(--r-pill); flex: none; }
  .chip-dot.ok { background: var(--success); }
  .chip-dot.busy { background: var(--warning); }
  .chip-dot.err { background: var(--danger); }
  .chip .name { font-weight: 600; color: var(--text-primary); max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .meta { color: var(--muted); }
  .chip-x {
    width: 18px; height: 18px;
    border: none;
    border-radius: var(--r-pill);
    background: var(--n2);
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .chip-x:hover { background: var(--n3); color: var(--text-body); }

  /* ---- Buttons --------------------------------------------------------- */
  button { font-family: var(--font); }
  .btn {
    height: 44px;
    padding: 0 18px;
    border-radius: var(--r-btn);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    display: inline-flex; align-items: center; gap: 8px;
    transition: background .12s, border-color .12s, color .12s;
  }
  .btn.sm { height: 34px; padding: 0 13px; font-size: 13px; }
  .btn.pill { border-radius: var(--r-pill); }

  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }

  .btn-secondary { background: #fff; border-color: #C7CAD1; color: var(--text-body); }
  .btn-secondary:hover { background: var(--n2); border-color: var(--faint-2); }

  .btn-danger { background: #fff; border-color: #EDB5B6; color: var(--danger); }
  .btn-danger:hover { background: #FCEDED; border-color: #E59A9B; }

  .btn-ghost { background: transparent; border-color: transparent; color: var(--accent); }
  .btn-ghost:hover { background: var(--accent-tint-bg); }

  .btn:disabled, .btn[disabled] {
    background: var(--n1); color: var(--faint-2); border-color: var(--n1);
    cursor: not-allowed;
  }

  /* ---- Options bar ----------------------------------------------------- */
  .options { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; }
  .opt {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13.5px; color: var(--text-body); cursor: pointer; user-select: none;
  }
  .opt input[type="checkbox"] { display: none; }
  .toggle {
    width: 36px; height: 20px; border-radius: var(--r-pill);
    background: var(--n3); position: relative; transition: background .15s; flex: none;
  }
  .toggle::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: var(--r-pill);
    background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.18);
  }
  .opt input:checked + .toggle { background: var(--accent); }
  .opt input:checked + .toggle::after { transform: translateX(16px); }
  .opt input:disabled + .toggle { opacity: .45; }

  /* ---- Category pills -------------------------------------------------- */
  .pills { display: flex; flex-wrap: wrap; gap: 9px; }
  .pill-btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 8px 0 15px;
    border: 1px solid var(--border); border-radius: var(--r-pill);
    background: #fff; color: var(--text-body);
    font-size: 13.5px; font-weight: 500; cursor: pointer;
    transition: background .12s, border-color .12s, color .12s;
  }
  .pill-btn:hover:not(:disabled) { border-color: var(--faint-2); background: var(--n1); }
  .pill-btn.active { background: var(--accent-tint-bg); border-color: var(--accent-tint-border); color: var(--accent-deep); font-weight: 600; }
  .pill-btn:disabled { color: var(--faint-2); background: var(--n1); border-color: var(--n2); cursor: not-allowed; }
  .badge {
    min-width: 20px; height: 20px; padding: 0 6px;
    border-radius: var(--r-pill); background: var(--n2); color: var(--muted);
    font-size: 11.5px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .pill-btn.active .badge { background: var(--accent); color: #fff; }
  .pill-btn:disabled .badge { background: var(--n2); color: var(--faint-2); }

  /* ---- Global filter --------------------------------------------------- */
  .filterbar { margin-bottom: 18px; }
  .filter-input {
    width: 100%; height: 44px; padding: 0 16px;
    border: 1px solid #C7CAD1; border-radius: var(--r-btn);
    font-size: 14px; font-family: var(--font); color: var(--text-primary); background: #fff; outline: none;
  }
  .filter-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint-bg); }
  .filter-info { display: block; font-size: 12px; color: var(--muted); margin-top: 7px; min-height: 14px; }
  mark.hl { background: #FFE9A8; color: inherit; border-radius: 3px; padding: 0 1px; }
  mark.hl.cur { background: #F7B500; color: #1E1F22; }

  /* raw-text match navigator */
  .raw-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .raw-count { font-size: 12.5px; color: var(--muted); font-weight: 600; margin-right: 4px; }
  .raw-nav .btn { width: 34px; padding: 0; justify-content: center; font-size: 17px; }

  /* ---- Tabs (General / Engineering) ------------------------------------ */
  .tabs { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--border); border-radius: var(--r-pill); background: var(--n1); margin-bottom: 16px; }
  .tab {
    height: 34px; padding: 0 18px; border: none; border-radius: var(--r-pill);
    background: transparent; color: var(--text-body); font-size: 13.5px; font-weight: 600;
    cursor: pointer; transition: background .12s, color .12s;
  }
  .tab:hover:not(.active) { background: var(--n2); }
  .tab.active { background: var(--accent); color: #fff; }

  /* ---- Two-column location table (value | where it was found) ---------- */
  .kv { border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden; }
  .kv-row {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 9px 14px; border-top: 1px solid var(--hairline);
  }
  .kv-row:first-child { border-top: none; }
  .kv-row:nth-child(odd) { background: var(--n1); }
  .kv-val { flex: 1; font-family: var(--mono); font-size: 13px; color: var(--text-primary); word-break: break-all; }
  .kv-loc {
    flex: none; font-size: 12px; color: var(--muted); font-weight: 600;
    white-space: nowrap; padding-top: 1px;
  }
  .kv-loc .more { color: var(--faint-2); font-weight: 500; }
  .kv-loc .more-link { color: var(--accent); cursor: pointer; }
  .kv-loc .more-link:hover { color: var(--accent-deep); text-decoration: underline; }

  /* Callout / popover listing every occurrence of a deduped value */
  .callout {
    position: absolute; z-index: 60; min-width: 210px; max-width: 360px;
    max-height: 300px; overflow: auto;
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(30,31,34,.14); padding: 11px 13px;
    animation: calloutIn .16s ease-out;
  }
  .callout-head { font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--text-primary); word-break: break-all; margin-bottom: 8px; padding-bottom: 7px; border-bottom: 1px solid var(--hairline); }
  .callout-list { display: flex; flex-direction: column; gap: 5px; }
  .callout-row { display: flex; gap: 10px; font-size: 12.5px; color: var(--text-body); }
  .callout-idx { color: var(--faint-2); min-width: 26px; flex: none; }
  .tloc { color: var(--muted); font-weight: 500; font-size: 12.5px; }
  .kv-head { display: flex; gap: 14px; padding: 7px 14px; background: var(--n2); border-bottom: 1px solid var(--border); }
  .kv-head span { font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
  .kv-head .h-val { flex: 1; }

  /* Parameters lens — sortable value/unit table */
  table.ptable { border-collapse: collapse; width: 100%; font-size: 13px; border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden; }
  table.ptable th, table.ptable td { padding: 8px 12px; text-align: left; border-top: 1px solid var(--hairline); }
  table.ptable thead th { background: var(--n2); color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; border-top: none; white-space: nowrap; }
  table.ptable thead th.sortable { cursor: pointer; user-select: none; }
  table.ptable thead th.sortable:hover { color: var(--text-body); background: var(--n3); }
  table.ptable tbody tr:nth-child(even) td { background: var(--n1); }
  table.ptable .p-num { font-family: var(--mono); font-weight: 600; color: var(--text-primary); text-align: right; white-space: nowrap; width: 1%; }
  table.ptable .p-unit { font-family: var(--mono); color: var(--text-body); white-space: nowrap; }
  table.ptable .p-loc { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }

  /* ---- Results panel --------------------------------------------------- */
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .panel-title { display: flex; align-items: baseline; gap: 10px; }
  .panel-title h2 { margin: 0; font-size: 17px; font-weight: 700; color: var(--heading); }
  .panel-title .count { font-size: 13px; color: var(--muted); font-weight: 600; }
  .panel-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  select.fmt {
    height: 34px; padding: 0 10px;
    border: 1px solid #C7CAD1; border-radius: var(--r-btn);
    background: #fff; color: var(--text-body); font-size: 13px; font-family: var(--font);
    cursor: pointer; outline: none;
  }
  select.fmt:focus { border-color: var(--accent); }

  /* raw text */
  pre.raw {
    margin: 0; max-height: 460px; overflow: auto; position: relative;
    border: 1px solid var(--border); border-radius: var(--r-card);
    padding: 16px; background: var(--n1);
    font-family: var(--mono); font-size: 12.5px; color: var(--text-primary);
    white-space: pre-wrap; word-break: break-word;
  }

  /* image gallery */
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .img-card { border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden; background: #fff; }
  .img-card .thumb {
    height: 130px; background: var(--n2); cursor: zoom-in;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .img-card .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; transition: transform .15s; }
  .img-card .thumb:hover img { transform: scale(1.04); }

  /* Lightbox (full-size image viewer) */
  .lightbox { position: fixed; inset: 0; z-index: 100; background: rgba(20,21,24,.88); display: flex; align-items: center; justify-content: center; animation: calloutIn .15s ease-out; }
  .lb-img { max-width: 90vw; max-height: 86vh; object-fit: contain; border-radius: 6px; background: #fff; box-shadow: 0 16px 60px rgba(0,0,0,.55); cursor: default; }
  .lb-btn {
    position: fixed; border: none; background: rgba(255,255,255,.13); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background .12s; line-height: 1;
  }
  .lb-btn:hover { background: rgba(255,255,255,.26); }
  .lb-nav { top: 50%; transform: translateY(-50%); width: 52px; height: 52px; border-radius: 50%; font-size: 30px; font-weight: 700; }
  .lb-prev { left: 18px; } .lb-next { right: 18px; }
  .lb-close { top: 16px; right: 18px; width: 40px; height: 40px; border-radius: 50%; font-size: 24px; }
  .lb-caption { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; color: #fff; font-size: 13px; font-weight: 600; opacity: .92; pointer-events: none; }
  .lb-caption .lb-counter { opacity: .7; }
  .img-card .img-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--hairline); }
  .img-card .img-name { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* tables — master/detail */
  .tbl-layout { display: flex; gap: 16px; align-items: flex-start; }
  .tbl-side { width: 250px; flex: none; display: flex; flex-direction: column; gap: 10px; }
  .tbl-list { display: flex; flex-direction: column; gap: 6px; max-height: 540px; overflow: auto; }
  .tbl-item {
    text-align: left; border: 1px solid var(--border); border-radius: 8px; background: #fff;
    padding: 9px 11px; cursor: pointer; font-family: var(--font);
    display: flex; flex-direction: column; gap: 2px;
  }
  .tbl-item:hover { background: var(--n1); border-color: var(--faint-2); }
  .tbl-item.active { background: var(--accent-tint-bg); border-color: var(--accent-tint-border); }
  .tbl-item-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
  .tbl-item.active .tbl-item-name { color: var(--accent-deep); }
  .tbl-item-loc { font-size: 11px; color: var(--muted); font-weight: 500; }
  .tbl-detail { flex: 1; min-width: 0; }
  .tbl-empty { font-size: 13px; color: var(--muted); padding: 12px 4px; }
  @media (max-width: 720px) { .tbl-layout { flex-direction: column; } .tbl-side { width: 100%; } }

  /* tables — single table view */
  .tbl-wrap { margin-bottom: 22px; }
  .tbl-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .tbl-head .tname { font-weight: 700; color: var(--text-primary); font-size: 14px; }
  .tbl-scroll { overflow: auto; border: 1px solid var(--border); border-radius: var(--r-card); max-height: 420px; }
  table.data { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.data td, table.data th { border: 1px solid var(--hairline); padding: 6px 10px; text-align: left; white-space: nowrap; color: var(--text-primary); }
  table.data tr:first-child td { background: var(--n2); font-weight: 700; position: sticky; top: 0; }

  /* empty / placeholder states */
  .empty {
    text-align: center; padding: 48px 20px; color: var(--muted);
    border: 1px dashed var(--border); border-radius: var(--r-card); background: var(--n1);
  }
  .empty .big { font-size: 15px; color: var(--text-body); font-weight: 600; margin-bottom: 4px; }

  /* ---- Toasts ---------------------------------------------------------- */
  #toasts {
    position: fixed; right: 18px; bottom: 18px;
    display: flex; flex-direction: column; gap: 10px; z-index: 50; max-width: 360px;
  }
  .toast {
    border: 1px solid var(--border); border-left-width: 3px;
    border-radius: 10px; background: #fff; padding: 11px 14px;
    font-size: 13px; color: var(--text-body);
    box-shadow: 0 6px 24px rgba(30,31,34,.10);
    animation: calloutIn .18s ease-out;
  }
  .toast.error { border-left-color: var(--danger); }
  .toast.warn  { border-left-color: var(--warning); }
  .toast.ok    { border-left-color: var(--success); }
  .toast .t-title { font-weight: 700; color: var(--text-primary); display: block; margin-bottom: 1px; }

  @keyframes calloutIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  /* small spinner for processing state */
  .spin { width: 13px; height: 13px; border: 2px solid var(--n3); border-top-color: var(--accent); border-radius: 50%; display: inline-block; animation: sp .7s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <header class="app">
    <h1>Data Extractor</h1>
  </header>
  <p class="privacy"><span class="dot"></span> 100% in your browser — nothing is uploaded. Libraries load from a CDN on first use only.</p>

  <!-- ============================ INPUT LAYER ============================ -->
  <p class="label">Input</p>
  <div class="dropzone card" id="dropzone" style="padding:0;">
    <textarea id="paste" placeholder="Paste text here, or drop a file anywhere on this box…&#10;Supports: TXT, CSV, JSON, HTML, XML, MD, LOG, PDF, DOCX, XLSX"></textarea>
    <div class="dz-footer">
      <span class="dz-hint" id="dzHint">Drop files (multiple OK) or paste. Results are pooled.</span>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-secondary sm" id="browseBtn">Browse files…</button>
        <button class="btn btn-danger sm" id="clearBtn">Clear all</button>
      </div>
    </div>
    <input type="file" id="fileInput" multiple class="hidden"
           accept=".txt,.csv,.json,.html,.htm,.xml,.md,.log,.pdf,.docx,.xlsx" />
  </div>

  <!-- file chip list -->
  <div class="chips" id="chips" style="margin:-4px 0 18px;"></div>

  <!-- ============================ OPTIONS =============================== -->

      <label class="opt"><input type="checkbox" id="optSort" /><span class="toggle"></span> Sort A–Z</label>

    <span id="filterInfo" class="filter-info"></span>

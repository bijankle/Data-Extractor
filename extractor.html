</div>

<div id="toasts"></div>

<script>
/* ============================================================================
   0. CDN LIBRARY LOADER (lazy)
   Each parser library is fetched only the first time a format needs it. This
   keeps initial open instant and minimizes network traffic to the CDN.
   ========================================================================== */
const LIBS = {
  pdfjs:   'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfWork: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  mammoth: 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',
  xlsx:    'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  papa:    'https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js',
  jszip:   'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
};

const LIB_TIMEOUT_MS = 25000; // a CDN script that never loads (offline / blocked) must not hang forever

const _loaded = {};
function loadScript(url) {
  if (_loaded[url]) return _loaded[url];
  _loaded[url] = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url;
    s.async = true;
    // Watchdog: a blocked/offline CDN often never fires onerror, so we bail out ourselves.
    const timer = setTimeout(() => {
      fail(new Error('Timed out loading a library from the CDN (' + url.split('/').pop() +
        '). You may be offline or the CDN is blocked — this tool needs internet on first use of PDF/DOCX/XLSX/CSV files.'));
    }, LIB_TIMEOUT_MS);
    const done = () => { clearTimeout(timer); };
    const fail = (err) => { done(); delete _loaded[url]; s.remove(); reject(err); }; // allow a later retry
    s.onload = () => { done(); resolve(); };
    s.onerror = () => fail(new Error('Could not load a library from the CDN (' + url.split('/').pop() + '). Check your connection.'));
    document.head.appendChild(s);
  });
  return _loaded[url];
}

async function ensurePdfjs() {
  await loadScript(LIBS.pdfjs);
  // PDF.js renders/parses on its own worker thread => keeps our page responsive.
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfWork;
}

/* ============================================================================
   1. SMALL UTILITIES
   ========================================================================== */
const $  = (sel) => document.querySelector(sel);
const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  Object.assign(n, props);
  for (const k of kids) n.append(k);
  return n;
};
const microYield = () => new Promise(r => setTimeout(r, 0)); // hand control back to the UI
const fmtBytes = (b) => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(1) + ' MB';

/*
  No-progress watchdog. Runs `task`, handing it a `beat()` function. Every call
  to beat() means "I'm still making progress" and resets the timer. If no beat
  (and no completion) happens within `ms`, the task is rejected so the UI can
  surface an error instead of spinning forever. Long-but-progressing work (e.g.
  a big multi-page PDF) keeps beating and is never killed; a truly stuck parse
  (hung CDN load, corrupt file) trips the watchdog.
*/
const STALL_TIMEOUT_MS = 30000;
function withWatchdog(label, task, ms = STALL_TIMEOUT_MS) {
  return new Promise((resolve, reject) => {
    let timer, settled = false;
    const stop = () => { settled = true; clearTimeout(timer); };
    const beat = () => {
      if (settled) return;
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (settled) return;
        settled = true;
        reject(new Error(label + ' stalled — no progress for ' + Math.round(ms / 1000) +
          's. The file may be too large or corrupt, or a CDN library is blocked. Aborting.'));
      }, ms);
    };
    beat(); // arm
    Promise.resolve(task(beat)).then(
      (v) => { if (!settled) { stop(); resolve(v); } },
      (e) => { if (!settled) { stop(); reject(e); } }
    );
  });
}

function toast(msg, kind = 'ok', title = '', duration = 4200) {
  const t = el('div', { className: 'toast ' + kind, title: 'Click to dismiss' });
  if (title) t.append(el('span', { className: 't-title', textContent: title }));
  t.append(document.createTextNode(msg));
  const dismiss = () => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); };
  t.addEventListener('click', dismiss);
  $('#toasts').append(t);
  setTimeout(dismiss, duration);
}

/* ============================================================================
   2. EXTRACTION PATTERNS (the text sieves)
   Each returns matches via a global-flagged regex. A `clean` step trims junk.
   ========================================================================== */
const PATTERNS = {
  emails: {
    re: /[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/g,
  },
  links: {
    re: /\b(?:https?:\/\/|www\.)[^\s"'<>)\]}]+/gi,
    clean: (s) => s.replace(/[.,;:!?'")\]]+$/, ''), // strip trailing sentence punctuation
  },
  dates: {
    re: new RegExp([
      '\\b\\d{4}-\\d{2}-\\d{2}\\b',                                   // 2024-06-23 (ISO)
      '\\b\\d{1,2}[\\/\\-.]\\d{1,2}[\\/\\-.]\\d{2,4}\\b',             // 23/06/2024, 6-23-24
      '\\b\\d{1,2}\\s(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\\.?\\s\\d{2,4}\\b', // 23 June 2024
      '\\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\\.?\\s\\d{1,2},?\\s\\d{2,4}\\b', // June 23, 2024
    ].join('|'), 'gi'),
  },
  money: {
    re: new RegExp([
      '(?:A\\$|US\\$|NZ\\$|\\$|€|£|¥)\\s?\\d[\\d,]*(?:\\.\\d{1,2})?', // $1,234.56 / A$50
      '\\d[\\d,]*(?:\\.\\d{1,2})?\\s?(?:AUD|USD|EUR|GBP|NZD|JPY)\\b',  // 1,234.56 AUD
    ].join('|'), 'gi'),
  },
};

/* Phone numbers — Australian-first (default) and an International loose mode. */
const PHONE_AU = new RegExp([
  '\\+61\\s?4\\d{2}\\s?\\d{3}\\s?\\d{3}',          // +61 4xx xxx xxx (mobile, intl)
  '\\+61\\s?[2378]\\s?\\d{4}\\s?\\d{4}',           // +61 x xxxx xxxx (landline, intl)
  '\\b04\\d{2}\\s?\\d{3}\\s?\\d{3}\\b',            // 04xx xxx xxx (mobile)
  '\\b0[2378]\\s?\\d{4}\\s?\\d{4}\\b',             // 0x xxxx xxxx (landline)
  '\\b1[38]00\\s?\\d{3}\\s?\\d{3}\\b',             // 1300 / 1800 xxx xxx
  '\\b13\\s?\\d{2}\\s?\\d{2}\\b',                  // 13 xx xx
].join('|'), 'g');

/* ----------------------------------------------------------------------------
   ENGINEERING SIEVES (Engineering tab)
   These are best-effort by nature — engineering notation is irregular, so each
   pattern trades some noise for coverage. Tweak the regexes/lists to taste.
   -------------------------------------------------------------------------- */

// Units used by the Parameters sieve. Longer/:more-specific first so e.g. "kPa"
// wins over "Pa", and compound units (m/s, m³/h) match before bare ones.
const ENG_UNITS = [
  'kg/m³','kg/m3','m³/h','m3/h','Nm³/h','L/min','L/s','m/s²','m/s2','m/s','km/h','t/h','kg/h','kg/s',
  'kPa','MPa','GPa','hPa','mbar','bar','psi','atm','mmHg','Pa',
  'kWh','MWh','GWh','kW','MW','GW','VA','kVA','MVA','W',
  'mA','kA','kV','mV','µV','A','V','Ω','ohm','µF','nF','pF','mH','µH',
  'GHz','MHz','kHz','Hz','rpm','dB','dBA',
  'mm²','mm2','cm²','cm2','m²','m2','mm³','mm3','cm³','cm3','m³','m3',
  'nm','µm','um','mm','cm','km','m','in','ft','yd','mil',
  'mg','µg','kg','kt','g','t','lb','oz',
  'mL','µL','kL','ML','L','gal',
  'GPa','kN','MN','N','Nm','kNm',
  '°C','°F','°K','K','°',
  'kJ','MJ','GJ','J','cal','kcal','BTU',
  'ppm','ppb','pH','cSt','cP','lux','lm','cd','mol','%RH','%','vol%',
].map(u => u.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');

const ENG = {
  // Formulas: an equation that has an operator on the RHS (e.g. e = mc^2,
  // P = F/A), or a standalone power term (mc^2, x^2). Best-effort.
  formulas: {
    re: new RegExp([
      '[A-Za-z0-9_)\\]]\\s*=\\s*[A-Za-z0-9_.\\s()]*[\\^*/+][A-Za-z0-9_.\\s()^*/+\\-]*', // var = ...op...
      '[A-Za-z0-9_)\\]]\\^[A-Za-z0-9_(+\\-]+',                                          // base^exp
    ].join('|'), 'g'),
    clean: (s) => s.trim().replace(/\s+/g, ' '),
  },
  // Parameters: a number followed by a known unit (50 kPa, 3.5 mm, 415V).
  // The leading "-" in the lookbehind stops it grabbing "101A" out of tag P-101A.
  parameters: {
    re: new RegExp('(?<![\\w.\\-])[-+]?\\d[\\d,]*(?:\\.\\d+)?\\s?(?:' + ENG_UNITS + ')(?![\\w])', 'g'),
    clean: (s) => s.trim().replace(/\s+/g, ' '),
  },
  // Standards & Codes: AS2419.1, AS/NZS 3000, ISO 9001, IEC 61511, ASME B31.3…
  // The optional [A-Z]{0,2} before the digits catches lettered codes (B31.3, Z535).
  standards: {
    re: /\b(?:AS\/NZS|ISO\/IEC|AS|ISO|IEC|IEEE|ASME|ASTM|API|ANSI|AHRI|NFPA|DIN|EN|BS|NACE|AWS|NZS|SAA)\s?[A-Z]{0,2}\d+(?:[.\-]\d+)*(?:\s?:\s?\d{4})?\b/g,
  },
  // Acronyms: 2–6 uppercase letters (HAZOP, PLC, HVAC). The lookarounds exclude
  // letters that are part of a tag/standard/doc number (HE-301, AS/NZS, PID-PR);
  // common English words are filtered out below.
  acronyms: {
    re: /(?<![\w\-/])[A-Z]{2,6}(?![\w\-/])/g,
    keep: (s) => !ACRONYM_STOPLIST.has(s),
  },
  // NB: Equipment Tags + Document Numbers are handled by collectCodes() below,
  // not by a simple regex — they need structural classification.
};

/* ----------------------------------------------------------------------------
   EQUIPMENT TAGS + DOCUMENT NUMBERS
   These share a shape (alphanumeric groups joined by hyphens) and, in PDF text,
   often come out with spaces around the hyphens ("226 - ZM - 001"). So we match
   the whole hyphen chain (spaces allowed), canonicalise it (strip the spaces),
   then classify it by structure:
     • equipment tag   AREA-TYPE-NUM (226-ZM-001) or TYPE-NUM (TIT-642, P-101A)
     • document number longer chains (P027A-000-MEM-ME-002, 2233-MDSP-091)
   Spaceless instrument tags (TT601, TE614A) are caught by a small prefix list.
   -------------------------------------------------------------------------- */
const INSTR_PREFIX = 'TIT|TICV|TIC|TCV|TE|TT|TC|PIT|PIC|PCV|PT|FIT|FIC|FCV|FT|LIT|LIC|LCV|LT|AIT|AT';

function classifyCode(groups) {
  const joined = groups.join('');
  if (!/\d/.test(joined)) return null;        // codes contain a digit
  if (!/[A-Z]/.test(joined)) return null;     // …and an uppercase letter
  if (/[a-z]/.test(joined)) return null;      // reject prose (side-by-side, air-cooled)
  if (groups.some(g => g.length > 8)) return null;
  const n = groups.length;
  if (n >= 4) return 'doc';
  if (n === 3) {
    const [a, b, c] = groups;
    if (/^\d+$/.test(a) && /^[A-Z]+$/.test(b) && /^\d+[A-Z]?$/.test(c)) return b.length <= 3 ? 'tag' : 'doc';
    return 'doc';
  }
  if (n === 2) {
    const [a, b] = groups;
    if (/^[A-Z]+$/.test(a) && /^\d+[A-Z]?$/.test(b)) return 'tag'; // TIT-642, P-101A
    return null;
  }
  return null;
}

function collectCodes(text) {
  const tags = [], docnums = [];
  let m;
  const chainRe = /[A-Za-z0-9]{1,8}(?:[ ]?[-–][ ]?[A-Za-z0-9]{1,8}){1,}/g;
  while ((m = chainRe.exec(text)) !== null) {
    const canon = m[0].replace(/\s*[-–]\s*/g, '-');
    const cls = classifyCode(canon.split('-'));
    if (cls === 'tag') tags.push({ value: canon, index: m.index });
    else if (cls === 'doc') docnums.push({ value: canon, index: m.index });
  }
  const instrRe = new RegExp('\\b(?:' + INSTR_PREFIX + ')\\d{2,4}[A-Z]?\\b', 'g');
  while ((m = instrRe.exec(text)) !== null) tags.push({ value: m[0], index: m.index });
  return { tags, docnums };
}

// Plain uppercase words that are not acronyms — filtered from the Acronyms lens.
const ACRONYM_STOPLIST = new Set(
  ('THE AND FOR ARE BUT NOT YOU ALL ANY CAN HAD HER WAS ONE OUR OUT GET HAS HIM HIS HOW MAN NEW NOW ' +
   'OLD SEE TWO WAY WHO DID ITS LET PUT SAY SHE TOO USE WITH FROM THIS THAT THEY HAVE WILL YOUR WHAT ' +
   'WHEN WHICH THERE THEIR ABOUT WOULD THESE OTHER BEEN MORE ALSO INTO ONLY OVER SUCH THAN THEM THEN ' +
   'WERE EACH MOST SOME TIME VERY WELL ITEM PAGE NOTE TBC TBA YES NO OK NA ' +
   'ONE TWO THREE FOUR FIVE SIX SEVEN EIGHT NINE TEN ZERO ' +
   'LIST CASE PLAN SCOPE LOAD DUTY FLOW RATE BASE TYPE UNIT AREA DATA NAME DATE SITE COST PURPOSE').split(/\s+/)
);

/* ============================================================================
   3. FORMAT ROUTER + PARSERS
   Every parser resolves to the normalized shape:
     { text, images:[{name,blob}], tables:[{name,rows}] }
   ========================================================================== */
function detectFormat(file) {
  const name = file.name.toLowerCase();
  const ext = name.slice(name.lastIndexOf('.') + 1);
  if (['txt','csv','json','html','htm','xml','md','log','text'].includes(ext)) return ext === 'htm' ? 'html' : ext;
  if (ext === 'pdf') return 'pdf';
  if (ext === 'docx') return 'docx';
  if (ext === 'xlsx') return 'xlsx';
  if (ext === 'doc') return 'doc-legacy';   // explicitly out of scope
  return 'unknown';
}

async function readAsText(file)        { return await file.text(); }
async function readAsArrayBuffer(file) { return await file.arrayBuffer(); }

/* --- Plain text family ------------------------------------------------- */
async function parsePlain(file) {
  const raw = await readAsText(file);
  return { sieveText: raw, displayText: raw, images: [], tables: [] };
}

/* --- HTML: strip tags for display, but sieve the raw markup (catches hrefs) */
async function parseHtml(file) {
  const raw = await readAsText(file);
  const doc = new DOMParser().parseFromString(raw, 'text/html');
  const clean = (doc.body ? doc.body.innerText : doc.documentElement.textContent) || '';
  return { sieveText: raw + '\n' + clean, displayText: clean.trim(), images: [], tables: [] };
}

/* --- CSV via PapaParse -> one table + flattened text ------------------- */
async function parseCsv(file) {
  await loadScript(LIBS.papa);
  const raw = await readAsText(file);
  const parsed = window.Papa.parse(raw.trim(), { skipEmptyLines: true });
  const rows = parsed.data;
  const tables = rows.length ? [{ name: file.name, rows }] : [];
  return { sieveText: raw, displayText: raw, images: [], tables };
}

/* --- JSON: pretty-print for display, sieve the raw ---------------------- */
async function parseJson(file) {
  const raw = await readAsText(file);
  let display = raw;
  try { display = JSON.stringify(JSON.parse(raw), null, 2); } catch (_) { /* leave as-is */ }
  return { sieveText: raw, displayText: display, images: [], tables: [] };
}

/* --- PDF via PDF.js: text + embedded images ---------------------------- */
async function parsePdf(file, beat = () => {}) {
  await ensurePdfjs();
  beat();
  const data = await readAsArrayBuffer(file);
  let pdf;
  try {
    pdf = await window.pdfjsLib.getDocument({ data }).promise;
  } catch (e) {
    if (e && e.name === 'PasswordException') throw new Error('This PDF is password-protected and can’t be opened.');
    throw e;
  }
  beat();
  let text = '';
  const pages = [];            // per-page text — drives the page number in locations
  const images = [];
  const tables = [];
  let tableCount = 0;
  const seen = new Set();

  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    beat(); // each page is progress — resets the no-progress watchdog

    // --- text layer ---
    const content = await page.getTextContent();
    const pageText = content.items.map(i => i.str).join(' ');
    pages.push(pageText);
    text += pageText + '\n';

    // --- tables: reconstruct from text geometry (positions) ---
    try {
      const viewport = page.getViewport({ scale: 1 });
      extractPdfTables(content, viewport).forEach((rows) => {
        // Just "Table N" — no filename prefix (usually one file at a time).
        tables.push({ name: `Table ${++tableCount}`, rows, page: p });
      });
    } catch (_) { /* table reconstruction is best-effort */ }

    // --- embedded images: walk the operator list for image paints ---
    try {
      const ops = await page.getOperatorList();
      const OPS = window.pdfjsLib.OPS;
      for (let i = 0; i < ops.fnArray.length; i++) {
        const fn = ops.fnArray[i];
        if (fn === OPS.paintImageXObject || fn === OPS.paintJpegXObject || fn === OPS.paintImageXObjectRepeat) {
          const objName = ops.argsArray[i][0];
          // 'g_'-prefixed images are global (shared across pages) — dedupe by name
          // alone so we don't grab the same logo on every page.
          const key = objName.startsWith('g_') ? objName : (p + ':' + objName);
          if (seen.has(key)) continue;
          seen.add(key);
          const blob = await pdfImageToBlob(page, objName);
          beat(); // image decode is progress
          if (blob) images.push({ name: `p${p}-${objName}.png`, blob, page: p });
        }
      }
    } catch (_) { /* image extraction is best-effort */ }

    await microYield(); // never block the UI between pages
  }

  if (!text.trim() && pdf.numPages > 0) {
    toast('This PDF has no extractable text layer (it may be scanned images). OCR is not included in v1.', 'warn', file.name);
  }
  return { sieveText: text, displayText: text.trim(), images, tables, pages };
}

/*
  Reconstruct tables from a PDF page's text geometry. PDFs have no "table"
  concept in the text layer — only positioned text — so this is heuristic:
    1. Group text items into rows by their Y position.
    2. Find recurring X "column anchors" (x-starts shared by several rows).
    3. Assign each row's items to the nearest column.
    4. Keep only runs of >=3 consecutive multi-column rows that contain at
       least one mostly-numeric column. That numeric guard is what separates a
       real data table (invoice line items, prices) from multi-column prose,
       which would otherwise masquerade as a table.
  It will miss borderless or irregular tables — full reconstruction is hard —
  but reliably catches clean grids like quotes/invoices.
*/
const _isNumericCell = (s) => /^[-+(]?\$?\s?\d[\d,]*\.?\d*\)?%?$/.test(s.trim());
function extractPdfTables(content, viewport) {
  const items = content.items
    .filter(i => i.str.trim())
    .map(i => ({ s: i.str.trim(), x: Math.round(i.transform[4]), y: Math.round(viewport.height - i.transform[5]) }));
  if (items.length < 6) return [];

  // 1. rows by Y (3px tolerance)
  items.sort((a, b) => a.y - b.y || a.x - b.x);
  const rows = [];
  let cur = null;
  for (const it of items) {
    if (!cur || Math.abs(it.y - cur.y) > 3) { cur = { y: it.y, cells: [it] }; rows.push(cur); }
    else cur.cells.push(it);
  }

  // 2. column anchors: cluster x-starts (22px) appearing in >=3 rows
  const xs = [];
  for (const r of rows) if (r.cells.length >= 2) for (const c of r.cells) xs.push(c.x);
  xs.sort((a, b) => a - b);
  const clusters = [];
  for (const x of xs) {
    const last = clusters[clusters.length - 1];
    if (last && x - last.sum / last.n <= 22) { last.sum += x; last.n++; }
    else clusters.push({ sum: x, n: 1 });
  }
  const cols = clusters.filter(c => c.n >= 3).map(c => Math.round(c.sum / c.n)).sort((a, b) => a - b);
  if (cols.length < 2) return [];

  // 3. map each row into columns (nearest anchor wins)
  const toCols = (r) => {
    const out = new Array(cols.length).fill('');
    for (const c of r.cells) {
      let bi = 0, bd = Infinity;
      cols.forEach((cx, i) => { const d = Math.abs(c.x - cx); if (d < bd) { bd = d; bi = i; } });
      out[bi] = out[bi] ? out[bi] + ' ' + c.s : c.s;
    }
    return out;
  };
  const mapped = rows.map(r => ({ y: r.y, cells: toCols(r), filled: 0 }));
  mapped.forEach(m => m.filled = m.cells.filter(Boolean).length);

  // 4. group consecutive multi-column rows (Y gap <= 20px) into blocks
  const blocks = [];
  let b = null;
  for (const m of mapped) {
    if (m.filled >= 2) { if (b && m.y - b.lastY <= 20) { b.rows.push(m.cells); b.lastY = m.y; } else { b = { rows: [m.cells], lastY: m.y }; blocks.push(b); } }
    else b = null;
  }

  // 5. keep blocks with >=3 rows and a mostly-numeric column; prune sparse cols
  const tables = [];
  for (const bl of blocks) {
    if (bl.rows.length < 3) continue;
    let numeric = false;
    for (let ci = 0; ci < cols.length; ci++) {
      const vals = bl.rows.map(r => r[ci]).filter(Boolean);
      if (vals.length >= 3 && vals.filter(_isNumericCell).length / vals.length >= 0.4) { numeric = true; break; }
    }
    if (!numeric) continue;
    tables.push(pruneSparseColumns(bl.rows));
  }
  return tables;
}

// Drop columns that are filled in <20% of rows (e.g. a centered header sitting
// between data columns), merging any stray text into the nearest kept column.
function pruneSparseColumns(rows) {
  const nCols = Math.max(...rows.map(r => r.length));
  const keep = [];
  for (let c = 0; c < nCols; c++) {
    const filled = rows.filter(r => r[c]).length;
    if (filled / rows.length >= 0.2) keep.push(c);
  }
  if (keep.length === nCols || keep.length === 0) return rows;
  const nearestKept = (c) => keep.reduce((best, k) => Math.abs(k - c) < Math.abs(best - c) ? k : best, keep[0]);
  return rows.map(r => {
    const merged = {};
    r.forEach((val, c) => {
      if (!val) return;
      const target = keep.includes(c) ? c : nearestKept(c);
      merged[target] = merged[target] ? merged[target] + ' ' + val : val;
    });
    return keep.map(c => merged[c] || '');
  });
}

// Pull one image object out of a PDF page and convert it to a PNG blob.
// Returns null (rather than hanging) if the object can't be resolved.
function pdfImageToBlob(page, objName) {
  return new Promise((resolve) => {
    let done = false;
    const finish = (v) => { if (!done) { done = true; resolve(v); } };

    const toBlob = (img) => {
      try {
        if (!img) return finish(null);
        const w = img.width, h = img.height;
        if (!w || !h || w * h < 64) return finish(null); // skip 1px spacers / junk
        const canvas = el('canvas'); canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        if (img.bitmap) {
          ctx.drawImage(img.bitmap, 0, 0);
        } else if (img.data) {
          const out = ctx.createImageData(w, h);
          const d = img.data, n = w * h;
          if (d.length === n * 4)      { out.data.set(d); }                                   // RGBA
          else if (d.length === n * 3) { for (let i=0,j=0;i<d.length;i+=3,j+=4){ out.data[j]=d[i]; out.data[j+1]=d[i+1]; out.data[j+2]=d[i+2]; out.data[j+3]=255; } } // RGB
          else if (d.length === n)     { for (let i=0,j=0;i<n;i++,j+=4){ out.data[j]=out.data[j+1]=out.data[j+2]=d[i]; out.data[j+3]=255; } } // grayscale (8bpp)
          else return finish(null);                                                           // packed/other => skip
          ctx.putImageData(out, 0, 0);
        } else return finish(null);
        canvas.toBlob((b) => finish(b), 'image/png');
      } catch (_) { finish(null); }
    };

    // Per-image safety timeout: some objects (e.g. inside forms) never resolve via
    // the callback. Without this, the await would hang the whole parse forever.
    setTimeout(() => finish(null), 4000);

    try {
      // 'g_'-prefixed names are GLOBAL objects on page.commonObjs; everything else
      // is on page.objs. Calling the wrong store's get() never fires its callback.
      const store = objName.startsWith('g_') ? page.commonObjs : page.objs;
      if (store.has(objName)) toBlob(store.get(objName)); // already decoded: sync
      else store.get(objName, toBlob);                    // otherwise: async callback
    } catch (_) { finish(null); }
  });
}

/* --- DOCX via mammoth: raw text + embedded images ---------------------- */
async function parseDocx(file) {
  await loadScript(LIBS.mammoth);
  const arrayBuffer = await readAsArrayBuffer(file);
  const images = [];

  // Custom image handler: collect each embedded image as a blob.
  const convertImage = window.mammoth.images.imgElement(async (image) => {
    const buf = await image.read('base64');
    const blob = base64ToBlob(buf, image.contentType || 'image/png');
    const ext = (image.contentType || 'image/png').split('/')[1] || 'png';
    images.push({ name: `image-${images.length + 1}.${ext}`, blob });
    return {}; // we don't need the HTML <img>, just the asset
  });

  const textResult = await window.mammoth.extractRawText({ arrayBuffer });
  // Run a second pass purely to trigger the image handler.
  await window.mammoth.convertToHtml({ arrayBuffer }, { convertImage });

  const text = textResult.value || '';
  return { sieveText: text, displayText: text.trim(), images, tables: [] };
}

/* --- XLSX via SheetJS: every sheet -> a table + flattened text --------- */
async function parseXlsx(file) {
  await loadScript(LIBS.xlsx);
  const data = await readAsArrayBuffer(file);
  const wb = window.XLSX.read(data, { type: 'array' });
  const tables = [];
  let text = '';
  for (const sheetName of wb.SheetNames) {
    const ws = wb.Sheets[sheetName];
    const rows = window.XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: false, defval: '' });
    if (rows.length) tables.push({ name: sheetName, rows });
    text += window.XLSX.utils.sheet_to_csv(ws) + '\n';
  }
  return { sieveText: text, displayText: text.trim(), images: [], tables };
}

// Route a single file to its parser. `beat` is the watchdog heartbeat.
async function parseFile(file, beat = () => {}) {
  const fmt = detectFormat(file);
  switch (fmt) {
    case 'txt': case 'log': case 'md': case 'xml': case 'text': return parsePlain(file);
    case 'html': return parseHtml(file);
    case 'csv':  return parseCsv(file);
    case 'json': return parseJson(file);
    case 'pdf':  return parsePdf(file, beat);
    case 'docx': return parseDocx(file);
    case 'xlsx': return parseXlsx(file);
    case 'doc-legacy':
      throw new Error('Legacy .doc is out of scope. Please re-save as .docx.');
    default:
      throw new Error('Unsupported file type. Supported: TXT, CSV, JSON, HTML, XML, MD, LOG, PDF, DOCX, XLSX.');
  }
}

/* small helpers for binary <-> blob */
function base64ToBlob(b64, type) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type });
}

/* ============================================================================
   4. APPLICATION STATE
   `sources` is the pool. 'paste' is a reserved source updated live. recompute()
   merges everything and runs the extraction layer.
   ========================================================================== */
const state = {
  sources: [],          // { id, name, status:'ok'|'busy'|'err', sieveText, displayText, images[], tables[], pages? }
  results: null,        // computed by recompute()
  active: 'rawText',    // currently selected category
  tab: 'general',       // 'general' | 'engineering'
  tableSel: 0,          // selected table index in the Tables lens
  filter: '',           // global filter text (applies to every lens)
  paramSort: { col: null, dir: 1 }, // Parameters lens sort: col 'value'|'unit'|'loc', dir 1 asc / -1 desc
};

// Definition of every category lens.
//   type: 'list' (text sieve results), 'raw' text, or structure ('images'/'tables').
//   tab:  which top-level tab the lens lives under.
// Contact Info merges emails + phones into a single lens.
const CATEGORIES = [
  // --- General tab ---
  { key: 'contact',   label: 'Contact Info', type: 'list', tab: 'general' },
  { key: 'links',     label: 'Links',   type: 'list',   tab: 'general' },
  { key: 'dates',     label: 'Dates',   type: 'list',   tab: 'general' },
  { key: 'money',     label: 'Money',   type: 'list',   tab: 'general' },
  { key: 'images',    label: 'Images',  type: 'images', tab: 'general' },
  { key: 'tables',    label: 'Tables',  type: 'tables', tab: 'general' },
  { key: 'rawText',   label: 'Raw Text', type: 'raw',   tab: 'general' },
  // --- Engineering tab ---
  { key: 'formulas',  label: 'Formulas',            type: 'list', tab: 'engineering' },
  { key: 'parameters',label: 'Parameters',          type: 'list', tab: 'engineering' },
  { key: 'standards', label: 'Standards & Codes',   type: 'list', tab: 'engineering' },
  { key: 'docnums',   label: 'Document Numbers',    type: 'list', tab: 'engineering' },
  { key: 'tags',      label: 'Equipment & Tags',    type: 'list', tab: 'engineering' },
  { key: 'acronyms',  label: 'Acronyms',            type: 'list', tab: 'engineering' },
];

/* ----- run all text sieves over the merged text, chunked to stay smooth --- */
// All list categories. Each entry maps a result key to its pattern. Phones get a
// digit-count guard. Results are arrays of { value, index } where index is the
// character offset into the combined text (used to compute page + position %).
async function runSieves(text) {
  const keys = ['contact','links','dates','money','formulas','parameters','standards','docnums','tags','acronyms'];
  const empty = Object.fromEntries(keys.map(k => [k, []]));
  if (!text) return empty;

  const emails     = await collectMatches(text, PATTERNS.emails);
  const phones     = await collectMatches(text, { re: PHONE_AU, keep: s => s.replace(/\D/g, '').length >= 6 });
  const links      = await collectMatches(text, PATTERNS.links);
  const dates      = await collectMatches(text, PATTERNS.dates);
  const money      = await collectMatches(text, PATTERNS.money);
  const formulas    = await collectMatches(text, ENG.formulas);
  const parameters  = await collectMatches(text, ENG.parameters);
  const standards   = await collectMatches(text, ENG.standards);
  const acronymsRaw = await collectMatches(text, ENG.acronyms);
  const { tags, docnums } = collectCodes(text); // structural classifier

  // Drop "acronyms" that are really the letter-parts of a detected tag/doc number
  // (e.g. ZM, PP, MEM, TIT) — the spaces around hyphens in PDF text let them slip
  // through the regex's adjacency guard.
  const codeWords = new Set();
  for (const c of tags)    { c.value.split('-').forEach(g => { if (/^[A-Z]{2,}$/.test(g)) codeWords.add(g); }); const p = c.value.match(/^[A-Z]{2,}/); if (p) codeWords.add(p[0]); }
  for (const c of docnums) c.value.split('-').forEach(g => { if (/^[A-Z]{2,}$/.test(g)) codeWords.add(g); });
  const acronyms = acronymsRaw.filter(a => !codeWords.has(a.value));

  // Contact Info merges emails + phones (ordering is fixed up by the sort step).
  return { contact: [...emails, ...phones], links, dates, money, formulas, parameters, standards, docnums, tags, acronyms };
}

// Run one pattern across the whole text, recording each match's char offset.
// Yields to the UI periodically so even huge inputs never freeze the page.
async function collectMatches(text, pattern) {
  const flags = pattern.re.flags.includes('g') ? pattern.re.flags : pattern.re.flags + 'g';
  const re = new RegExp(pattern.re.source, flags); // fresh instance: own lastIndex
  const out = [];
  let m, n = 0;
  while ((m = re.exec(text)) !== null) {
    if (m.index === re.lastIndex) re.lastIndex++;   // guard against zero-length matches
    let v = m[0];
    if (pattern.clean) v = pattern.clean(v);
    v = (v || '').trim();
    if (!v) continue;
    if (pattern.keep && !pattern.keep(v)) continue;
    out.push({ value: v, index: m.index });
    if (++n % 2000 === 0) await microYield();
  }
  return out;
}

/* ----- merge pool -> run extraction -> render --------------------------- */
let recomputeToken = 0;
async function recompute() {
  const myToken = ++recomputeToken; // guard against overlapping async runs

  const ready = state.sources.filter(s => s.status === 'ok');

  // Build ONE combined text for sieving, plus a locator: a list of segments that
  // remembers where each page / source begins, so a match's offset can be turned
  // back into "Page N (X%)". PDFs contribute one segment per page; everything
  // else is a single page-less segment.
  let combined = '';
  const segments = [];
  for (const s of ready) {
    if (s.pages && s.pages.length) {
      s.pages.forEach((pt, pi) => { segments.push({ start: combined.length, page: pi + 1, source: s.name }); combined += pt + '\n'; });
    } else {
      segments.push({ start: combined.length, page: null, source: s.name });
      combined += (s.sieveText || '') + '\n';
    }
    combined += '\n'; // separator between sources
  }
  state.locator = { segments, total: Math.max(1, combined.length), multi: ready.length > 1 };

  // Raw Text: collapse any run of 3+ line breaks down to 2, so there is never
  // more than a single empty row between two blocks of text.
  const displayText = ready.map(s => s.displayText).filter(Boolean).join('\n\n— — —\n\n')
                        .replace(/[ \t]+\n/g, '\n')   // trim trailing spaces on lines
                        .replace(/\n{3,}/g, '\n\n');   // max one blank line between blocks
  // Attach the source name so image/table captions can resolve their location.
  const images = ready.flatMap(s => s.images.map(img => ({ ...img, source: s.name })));
  const tables = ready.flatMap(s => s.tables.map(t => ({ ...t, source: s.name })));

  const sieves = await runSieves(combined);
  if (myToken !== recomputeToken) return; // a newer run superseded us

  state.results = { ...sieves, rawText: displayText, images, tables };

  // Apply list options (dedupe/sort) once, store the display-ready arrays.
  state.display = {};
  for (const cat of CATEGORIES) {
    if (cat.type === 'list') state.display[cat.key] = applyListOptions(state.results[cat.key] || []);
  }

  renderPills();
  renderPanel();
  updateFilterInfo();
}

// Dedupe (case-insensitive) and order the items. Every occurrence's offset is
// kept in `indices` so the "(+N more)" callout can list them all.
// Returns [{ value, index, indices:[…] }] where index is the first occurrence.
function applyListOptions(arr) {
  let items;
  if ($('#optDedupe').checked) {
    const map = new Map();
    for (const it of arr) {
      const k = it.value.toLowerCase();
      if (map.has(k)) map.get(k).indices.push(it.index);
      else map.set(k, { value: it.value, index: it.index, indices: [it.index] });
    }
    items = [...map.values()];
  } else {
    items = arr.map(it => ({ value: it.value, index: it.index, indices: [it.index] }));
  }
  if ($('#optSort').checked) items.sort((a, b) => a.value.localeCompare(b.value, undefined, { sensitivity: 'base' }));
  else items.sort((a, b) => a.index - b.index); // source order = document order
  return items;
}

// Turn a character offset into a human location: "Page 5 (80%)", "80%", or
// "report.pdf · Page 5 (80%)" when several sources are pooled.
function locate(index) {
  const loc = state.locator;
  if (!loc) return '';
  const pct = Math.min(100, Math.max(0, Math.round(index / loc.total * 100)));
  let seg = loc.segments[0];
  for (const s of loc.segments) { if (s.start <= index) seg = s; else break; }
  const parts = [];
  if (loc.multi && seg) parts.push(seg.source);
  if (seg && seg.page != null) parts.push('Page ' + seg.page);
  return parts.length ? parts.join(' · ') + ' (' + pct + '%)' : pct + '%';
}

// Location for an item that knows its page directly (images, tables). The % is
// the page's starting position in the document. Non-paged inputs (DOCX images,
// XLSX/CSV sheets) have no page, so we show the source name only (or nothing).
function pageLocation(source, page) {
  const loc = state.locator;
  if (!loc) return '';
  if (page != null) {
    const seg = loc.segments.find(s => s.source === source && s.page === page);
    const pct = Math.min(100, Math.max(0, Math.round((seg ? seg.start : 0) / loc.total * 100)));
    return (loc.multi ? source + ' · ' : '') + 'Page ' + page + ' (' + pct + '%)';
  }
  return loc.multi ? source : '';
}

/* ----------------------------------------------------------------------------
   GLOBAL FILTER
   Smart matching (case/space/punctuation-insensitive — "lo l" matches "lol")
   used for both filtering and highlighting. Raw Text and Images are never
   filtered out (per design): Raw Text just highlights + offers match navigation,
   Images always show.
   -------------------------------------------------------------------------- */
function getFilter() {
  const q = (state.filter || '').trim();
  if (!q) return null;
  const norm = q.toLowerCase().replace(/[^a-z0-9]/g, '');
  if (!norm) return null;
  // chars in order, allowing any non-alphanumerics between them
  const src = norm.split('').join('[^a-zA-Z0-9]*');
  return { src, test: (s) => new RegExp(src, 'i').test(s || '') };
}

// Append `text` to `parent`, wrapping filter matches in <mark> (collected into
// `marks` if provided). Uses text nodes only — never innerHTML — so it is safe.
function appendHighlighted(parent, text, filter, marks) {
  text = text == null ? '' : String(text);
  if (!filter) { parent.append(document.createTextNode(text)); return; }
  const re = new RegExp(filter.src, 'gi');
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index === re.lastIndex) { re.lastIndex++; continue; }
    if (!m[0]) continue;
    if (m.index > last) parent.append(document.createTextNode(text.slice(last, m.index)));
    const mk = el('mark', { className: 'hl', textContent: m[0] });
    if (marks) marks.push(mk);
    parent.append(mk);
    last = m.index + m[0].length;
  }
  if (last < text.length) parent.append(document.createTextNode(text.slice(last)));
}

// Filtered list items (by value). No filter => unchanged.
function applyFilterList(items) {
  const f = getFilter();
  return f ? items.filter(it => f.test(it.value)) : items;
}
// Does a table contain the filter term anywhere (name or cells)?
function tableMatches(t, f) {
  return !f || f.test(t.name + ' ' + t.rows.map(r => (Array.isArray(r) ? r : [r]).join(' ')).join(' '));
}
function filteredTables() {
  const f = getFilter();
  return (state.results ? state.results.tables : []).filter(t => tableMatches(t, f));
}

// How many items does a category currently hold? Drives badges + enabled state.
// With a filter active, list lenses and Tables reflect matching counts; Raw Text
// and Images are never filtered.
function countOf(key) {
  if (!state.results) return 0;
  if (key === 'rawText') return state.results.rawText ? 1 : 0;
  if (key === 'images')  return state.results.images.length;
  if (key === 'tables')  return filteredTables().length;
  return applyFilterList(state.display[key] || []).length;
}

/* ============================================================================
   5. RENDERING
   ========================================================================== */
function renderPills() {
  const wrap = $('#pills'); wrap.innerHTML = '';
  const inTab = CATEGORIES.filter(c => c.tab === state.tab);

  // If the active category isn't in this tab or is empty, jump to the first
  // category in the tab that has results (else the first one, shown disabled).
  if (!inTab.some(c => c.key === state.active) || countOf(state.active) === 0) {
    const firstFull = inTab.find(c => countOf(c.key) > 0);
    state.active = firstFull ? firstFull.key : inTab[0].key;
  }

  for (const cat of inTab) {
    const n = countOf(cat.key);
    const enabled = n > 0;
    const btn = el('button', {
      className: 'pill-btn' + (state.active === cat.key && enabled ? ' active' : ''),
      disabled: !enabled,
      onclick: () => { state.active = cat.key; renderPills(); renderPanel(); },
    });
    btn.append(cat.label);
    // Raw Text shows no count badge (it's a single view); others do.
    if (cat.key !== 'rawText') btn.append(el('span', { className: 'badge', textContent: String(n) }));
    wrap.append(btn);
  }
}

function renderPanel() {
  closeCallout(); // any open occurrence popover belongs to the previous view
  closeLightbox();
  const body = $('#panelBody'); body.innerHTML = '';

  const anything = CATEGORIES.some(c => countOf(c.key) > 0);
  if (!anything) {
    body.append(el('div', { className: 'empty', innerHTML:
      '<div class="big">Nothing loaded yet</div>Paste some text or drop a file to get started.' }));
    return;
  }

  const cat = CATEGORIES.find(c => c.key === state.active);
  const n = countOf(cat.key);

  // ----- header (title + shared output controls) -----
  const head = el('div', { className: 'panel-head' });
  const title = el('div', { className: 'panel-title' });
  title.append(el('h2', { textContent: cat.label }));
  if (cat.key !== 'rawText') title.append(el('span', { className: 'count', textContent: n + (n === 1 ? ' result' : ' results') }));
  head.append(title);
  head.append(buildOutputControls(cat));
  body.append(head);

  // ----- body by type ----- (list lenses get filtered to matching items)
  if (cat.key === 'parameters')   renderParameters(body, applyFilterList(state.display[cat.key]));
  else if (cat.type === 'list')   renderList(body, applyFilterList(state.display[cat.key]));
  else if (cat.type === 'raw')    renderRaw(body, state.results.rawText);
  else if (cat.type === 'images') renderGallery(body, state.results.images);
  else if (cat.type === 'tables') renderTables(body, state.results.tables);
}

/* shared output layer: Copy All + Download (format-aware) ---------------- */
function buildOutputControls(cat) {
  const actions = el('div', { className: 'panel-actions' });

  if (cat.type === 'list' || cat.type === 'raw') {
    // Exports are values-only (no location column) and honour the active filter.
    const getItems = () => cat.type === 'raw' ? [state.results.rawText] : applyFilterList(state.display[cat.key]).map(d => d.value);

    actions.append(el('button', {
      className: 'btn btn-secondary sm', textContent: 'Copy All',
      onclick: async () => {
        await navigator.clipboard.writeText(getItems().join('\n'));
        toast('Copied ' + (cat.type === 'raw' ? 'text' : getItems().length + ' items') + ' to clipboard.', 'ok');
      },
    }));

    // format selector (TXT / CSV / JSON); raw text is TXT only
    let fmt = 'txt';
    if (cat.type === 'list') {
      const sel = el('select', { className: 'fmt', onchange: (e) => fmt = e.target.value });
      sel.append(el('option', { value: 'txt', textContent: 'TXT' }));
      sel.append(el('option', { value: 'csv', textContent: 'CSV' }));
      sel.append(el('option', { value: 'json', textContent: 'JSON' }));
      actions.append(sel);
    }

    actions.append(el('button', {
      className: 'btn btn-primary sm', textContent: 'Download',
      onclick: () => {
        const items = getItems();
        if (cat.type === 'raw') return downloadText(items[0], cat.key + '.txt');
        if (fmt === 'txt')  downloadText(items.join('\n'), cat.key + '.txt');
        if (fmt === 'csv')  downloadText(toCsvColumn(cat.label, items), cat.key + '.csv');
        if (fmt === 'json') downloadText(JSON.stringify(items, null, 2), cat.key + '.json');
      },
    }));
  }

  if (cat.type === 'images') {
    actions.append(el('button', {
      className: 'btn btn-primary sm', textContent: 'Download all (.zip)',
      onclick: () => downloadImagesZip(state.results.images),
    }));
  }

  if (cat.type === 'tables') {
    // One workbook, one sheet per table (CSV can't hold multiple tabs, so .xlsx).
    actions.append(el('button', {
      className: 'btn btn-primary sm', textContent: 'Download all (Excel)',
      onclick: () => downloadTablesXlsx(state.results.tables),
    }));
  }

  return actions;
}

// Two-column table: the extracted value, and where it was found in the document
// (page + position %). Repeats collapsed by dedupe show a "(+N more)" note.
function renderList(body, items) {
  if (!items.length) { body.append(el('div', { className: 'empty', textContent: 'No matches.' })); return; }
  const kv = el('div', { className: 'kv' });
  const head = el('div', { className: 'kv-head' });
  head.append(el('span', { className: 'h-val', textContent: 'Value' }));
  head.append(el('span', { textContent: 'Found at' }));
  kv.append(head);
  const filter = getFilter();
  items.forEach((item) => {
    const row = el('div', { className: 'kv-row' });
    const val = el('span', { className: 'kv-val' });
    appendHighlighted(val, item.value, filter);
    row.append(val);
    row.append(locCell(item, 'kv-loc'));
    kv.append(row);
  });
  body.append(kv);
}

// A "Found at" cell/span: the first location + a clickable "(+N more)" that opens
// the all-occurrences callout. Reused by the list and the Parameters table.
function locCell(item, className) {
  const loc = el('span', { className, textContent: locate(item.index) });
  const extra = item.indices.length - 1;
  if (extra > 0) {
    const more = el('span', { className: 'more more-link', textContent: '  (+' + extra + ' more)' });
    more.addEventListener('click', (e) => { e.stopPropagation(); showOccurrences(more, item); });
    loc.append(more);
  }
  return loc;
}

// Parameters lens: a sortable Value | Unit | Found-at table. Click the Value
// header to sort by numeric magnitude, the Unit header to sort A–Z (each click
// toggles direction).
function renderParameters(body, items) {
  if (!items.length) { body.append(el('div', { className: 'empty', textContent: 'No matches.' })); return; }
  // Split each "50 kPa" into a number + unit.
  const parsed = items.map((it) => {
    const m = it.value.match(/^\s*([-+]?[\d,]*\.?\d+)\s*(.*)$/);
    return { ...it, numStr: m ? m[1] : it.value, num: m ? parseFloat(m[1].replace(/,/g, '')) : NaN, unit: m ? m[2].trim() : '' };
  });
  const host = el('div'); body.append(host);

  const paint = () => {
    host.innerHTML = '';
    const ps = state.paramSort;
    const rows = parsed.slice();
    if (ps.col === 'value')      rows.sort((a, b) => (a.num - b.num) * ps.dir);
    else if (ps.col === 'unit')  rows.sort((a, b) => (a.unit.localeCompare(b.unit, undefined, { sensitivity: 'base' }) || (a.num - b.num)) * ps.dir);
    else if (ps.col === 'loc')   rows.sort((a, b) => (a.index - b.index) * ps.dir); // document position
    // else: leave in the order applyListOptions produced (source order / A–Z)

    const arrow = (c) => ps.col === c ? (ps.dir > 0 ? ' ▲' : ' ▼') : '';
    const table = el('table', { className: 'ptable' });
    const thead = el('thead'); const htr = el('tr');
    const thVal  = el('th', { className: 'sortable', textContent: 'Value' + arrow('value'), title: 'Sort by value' });
    const thUnit = el('th', { className: 'sortable', textContent: 'Unit' + arrow('unit'), title: 'Sort A–Z by unit' });
    const thLoc  = el('th', { className: 'sortable', textContent: 'Found at' + arrow('loc'), title: 'Sort by position in the document' });
    thVal.onclick  = () => setSort('value');
    thUnit.onclick = () => setSort('unit');
    thLoc.onclick  = () => setSort('loc');
    htr.append(thVal, thUnit, thLoc); thead.append(htr); table.append(thead);

    const tbody = el('tbody');
    const filter = getFilter();
    rows.forEach((r) => {
      const tr = el('tr');
      const numTd = el('td', { className: 'p-num' }); appendHighlighted(numTd, r.numStr, filter); tr.append(numTd);
      const unitTd = el('td', { className: 'p-unit' }); appendHighlighted(unitTd, r.unit, filter); tr.append(unitTd);
      const td = el('td'); td.append(locCell(r, 'p-loc')); tr.append(td);
      tbody.append(tr);
    });
    table.append(tbody);
    host.append(table);
  };
  const setSort = (col) => {
    const ps = state.paramSort;
    if (ps.col === col) ps.dir = -ps.dir; else { ps.col = col; ps.dir = 1; }
    paint();
  };
  paint();
}

/* Popover listing every occurrence (location) of a deduped value. */
let openCallout = null;
function closeCallout() {
  if (openCallout) { openCallout.remove(); openCallout = null; document.removeEventListener('click', closeCallout); window.removeEventListener('resize', closeCallout); }
}
function showOccurrences(anchor, item) {
  closeCallout();
  const co = el('div', { className: 'callout' });
  co.addEventListener('click', (e) => e.stopPropagation()); // clicks inside don't close it
  co.append(el('div', { className: 'callout-head', textContent: item.value }));
  const list = el('div', { className: 'callout-list' });
  item.indices.forEach((idx, i) => {
    const r = el('div', { className: 'callout-row' });
    r.append(el('span', { className: 'callout-idx', textContent: '#' + (i + 1) }));
    r.append(el('span', { textContent: locate(idx) }));
    list.append(r);
  });
  co.append(list);
  document.body.append(co);

  // Position below the link, kept inside the viewport horizontally.
  const a = anchor.getBoundingClientRect();
  const maxLeft = window.scrollX + document.documentElement.clientWidth - co.offsetWidth - 12;
  co.style.top = (window.scrollY + a.bottom + 6) + 'px';
  co.style.left = Math.max(window.scrollX + 8, Math.min(window.scrollX + a.left, maxLeft)) + 'px';

  openCallout = co;
  setTimeout(() => { document.addEventListener('click', closeCallout); window.addEventListener('resize', closeCallout); }, 0);
}

function renderRaw(body, text) {
  const filter = getFilter();
  const pre = el('pre', { className: 'raw' });
  const marks = [];
  appendHighlighted(pre, text || '(empty)', filter, marks);

  if (filter) {
    // A little nav bar to jump between matches in the (possibly long) text.
    const nav = el('div', { className: 'raw-nav' });
    const counter = el('span', { className: 'raw-count' });
    nav.append(counter);
    if (marks.length) {
      let cur = -1;
      const go = (i) => {
        if (cur >= 0) marks[cur].classList.remove('cur');
        cur = (i + marks.length) % marks.length;
        const mk = marks[cur]; mk.classList.add('cur');
        pre.scrollTop = mk.offsetTop - pre.clientHeight / 2;   // centre the match in the box
        counter.textContent = (cur + 1) + ' / ' + marks.length + ' matches';
      };
      const prev = el('button', { className: 'btn btn-secondary sm', textContent: '‹', title: 'Previous match' });
      const next = el('button', { className: 'btn btn-secondary sm', textContent: '›', title: 'Next match' });
      prev.onclick = () => go(cur - 1);
      next.onclick = () => go(cur + 1);
      nav.append(prev, next);
      body.append(nav);
      body.append(pre);
      go(0); // jump to the first match
      return;
    }
    counter.textContent = 'No matches in the text';
    body.append(nav);
  }
  body.append(pre);
}

function renderGallery(body, images) {
  const grid = el('div', { className: 'gallery' });
  images.forEach((img, idx) => {
    const url = URL.createObjectURL(img.blob);
    const card = el('div', { className: 'img-card' });
    const thumb = el('div', { className: 'thumb', title: 'Click to view full size' });
    thumb.append(el('img', { src: url, alt: img.name, loading: 'lazy' }));
    thumb.addEventListener('click', () => openLightbox(images, idx));
    const foot = el('div', { className: 'img-foot' });
    // Caption = where the image was found (page + position %); filename on hover.
    const loc = pageLocation(img.source, img.page);
    foot.append(el('span', { className: 'img-name', textContent: loc || img.name, title: img.name }));
    foot.append(el('button', { className: 'btn btn-ghost sm', textContent: 'Save',
      onclick: () => downloadBlob(img.blob, img.name) }));
    card.append(thumb); card.append(foot);
    grid.append(card);
  });
  body.append(grid);
}

/* Full-size image viewer with prev/next + keyboard nav (←/→/Esc). */
let activeLightbox = null, lbKeyHandler = null;
function closeLightbox() {
  if (!activeLightbox) return;
  document.removeEventListener('keydown', lbKeyHandler);
  if (activeLightbox.url) URL.revokeObjectURL(activeLightbox.url);
  activeLightbox.overlay.remove();
  activeLightbox = null; lbKeyHandler = null;
}
function openLightbox(images, startIdx) {
  closeLightbox();
  let idx = startIdx;
  const overlay  = el('div', { className: 'lightbox' });
  const img      = el('img', { className: 'lb-img', alt: '' });
  const caption  = el('div', { className: 'lb-caption' });
  const prev     = el('button', { className: 'lb-btn lb-nav lb-prev',  textContent: '‹', title: 'Previous (←)' });
  const next     = el('button', { className: 'lb-btn lb-nav lb-next',  textContent: '›', title: 'Next (→)' });
  const close    = el('button', { className: 'lb-btn lb-close',        textContent: '×', title: 'Close (Esc)' });

  const show = (i) => {
    idx = (i + images.length) % images.length;
    const im = images[idx];
    if (activeLightbox.url) URL.revokeObjectURL(activeLightbox.url);
    activeLightbox.url = URL.createObjectURL(im.blob);
    img.src = activeLightbox.url;
    const loc = pageLocation(im.source, im.page);
    caption.innerHTML = '';
    if (images.length > 1) caption.append(el('span', { className: 'lb-counter', textContent: (idx + 1) + ' / ' + images.length + '   ·   ' }));
    caption.append(document.createTextNode(loc || im.name));
  };

  prev.onclick  = (e) => { e.stopPropagation(); show(idx - 1); };
  next.onclick  = (e) => { e.stopPropagation(); show(idx + 1); };
  close.onclick = (e) => { e.stopPropagation(); closeLightbox(); };
  img.onclick   = (e) => e.stopPropagation();              // clicks on the image don't close
  overlay.onclick = () => closeLightbox();                 // clicking the backdrop does
  if (images.length < 2) { prev.style.display = next.style.display = 'none'; }

  lbKeyHandler = (e) => {
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft')  show(idx - 1);
    else if (e.key === 'ArrowRight') show(idx + 1);
  };
  document.addEventListener('keydown', lbKeyHandler);

  overlay.append(img, prev, next, close, caption);
  document.body.append(overlay);
  activeLightbox = { overlay, url: null };
  show(idx);
}

function renderTables(body, tables) {
  // Master/detail: a list of tables on the left, the selected table on the right.
  // The global filter hides tables with no match and highlights matches in the
  // table shown.
  const filter = getFilter();
  const visible = tables.map((t, i) => ({ t, i })).filter(({ t }) => tableMatches(t, filter));

  const layout = el('div', { className: 'tbl-layout' });
  const side = el('div', { className: 'tbl-side' });
  const listEl = el('div', { className: 'tbl-list' });
  side.append(listEl);
  const detail = el('div', { className: 'tbl-detail' });
  layout.append(side, detail);
  body.append(layout);

  // Keep the selection on a visible table.
  let sel = state.tableSel;
  if (!visible.some(v => v.i === sel)) sel = visible.length ? visible[0].i : -1;

  function paintList() {
    listEl.innerHTML = '';
    if (!visible.length) { listEl.append(el('div', { className: 'tbl-empty', textContent: 'No tables match the filter.' })); return; }
    visible.forEach(({ t, i }) => {
      const item = el('button', { className: 'tbl-item' + (i === sel ? ' active' : '') });
      item.append(el('span', { className: 'tbl-item-name', textContent: t.name }));
      const loc = pageLocation(t.source, t.page);
      if (loc) item.append(el('span', { className: 'tbl-item-loc', textContent: loc }));
      item.onclick = () => { sel = i; state.tableSel = i; paintList(); paintDetail(); };
      listEl.append(item);
    });
  }

  function paintDetail() {
    detail.innerHTML = '';
    if (sel < 0) { detail.append(el('div', { className: 'empty', textContent: 'No table to show.' })); return; }
    detail.append(renderOneTable(tables[sel], sel, filter));
  }

  paintList();
  paintDetail();
}

// Render a single table (header + copy/download + scrollable grid). When a filter
// is active, matching cell text is highlighted.
function renderOneTable(t, ti, filter) {
  const wrap = el('div', { className: 'tbl-wrap' });
  const head = el('div', { className: 'tbl-head' });
  const title = el('span', { className: 'tname', textContent: t.name });
  const loc = pageLocation(t.source, t.page);
  if (loc) title.append(el('span', { className: 'tloc', textContent: '  ·  ' + loc }));
  head.append(title);
  const btns = el('div', { style: 'display:flex; gap:8px;' });
  // Copy this table to the clipboard as TSV (pastes cleanly into Excel/Sheets).
  btns.append(el('button', { className: 'btn btn-secondary sm', textContent: 'Copy to clipboard',
    onclick: async () => { await navigator.clipboard.writeText(rowsToTsv(t.rows)); toast('Copied “' + t.name + '” to clipboard.', 'ok'); } }));
  btns.append(el('button', { className: 'btn btn-secondary sm', textContent: 'Download CSV',
    onclick: () => downloadText(rowsToCsv(t.rows), (t.name || ('table' + ti)) + '.csv') }));
  head.append(btns);
  wrap.append(head);

  const scroll = el('div', { className: 'tbl-scroll' });
  const table = el('table', { className: 'data' });
  t.rows.slice(0, 500).forEach((r) => { // cap render at 500 rows for responsiveness
    const tr = el('tr');
    (Array.isArray(r) ? r : [r]).forEach((c) => {
      const td = el('td');
      appendHighlighted(td, c == null ? '' : String(c), filter);
      tr.append(td);
    });
    table.append(tr);
  });
  scroll.append(table);
  wrap.append(scroll);
  if (t.rows.length > 500) wrap.append(el('div', { className: 'dz-hint', style: 'margin-top:6px;',
    textContent: `Showing first 500 of ${t.rows.length} rows. Download CSV for the full table.` }));
  return wrap;
}

/* ============================================================================
   6. OUTPUT HELPERS (download / CSV building)
   ========================================================================== */
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: filename });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function downloadText(text, filename) {
  downloadBlob(new Blob([text], { type: 'text/plain;charset=utf-8' }), filename);
}
function csvCell(v) {
  const s = v == null ? '' : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCsvColumn(header, items) {
  return [csvCell(header), ...items.map(csvCell)].join('\n');
}
function rowsToCsv(rows) {
  return rows.map(r => (Array.isArray(r) ? r : [r]).map(csvCell).join(',')).join('\n');
}
// Tab-separated — what spreadsheets expect when pasting from the clipboard.
function rowsToTsv(rows) {
  return rows.map(r => (Array.isArray(r) ? r : [r]).map(c => (c == null ? '' : String(c)).replace(/\t/g, ' ')).join('\t')).join('\n');
}

// Download all tables as ONE Excel workbook, one sheet per table (uses SheetJS).
async function downloadTablesXlsx(tables) {
  if (!tables.length) return;
  try {
    await loadScript(LIBS.xlsx);
    const wb = window.XLSX.utils.book_new();
    const used = new Set();
    tables.forEach((t, i) => {
      const ws = window.XLSX.utils.aoa_to_sheet(t.rows.map(r => Array.isArray(r) ? r : [r]));
      // Excel sheet names: <=31 chars, no \ / ? * [ ] :, and must be unique.
      let name = (t.name || ('Table ' + (i + 1))).replace(/[\\/?*\[\]:]/g, ' ').slice(0, 31).trim() || ('Table ' + (i + 1));
      let base = name, k = 2;
      while (used.has(name.toLowerCase())) { const suffix = ' (' + (k++) + ')'; name = base.slice(0, 31 - suffix.length) + suffix; }
      used.add(name.toLowerCase());
      window.XLSX.utils.book_append_sheet(wb, ws, name);
    });
    window.XLSX.writeFile(wb, 'tables.xlsx');
    toast(`Saved ${tables.length} table${tables.length === 1 ? '' : 's'} to tables.xlsx.`, 'ok');
  } catch (e) {
    toast(e.message, 'error', 'Excel export failed');
  }
}
async function downloadImagesZip(images) {
  if (!images.length) return;
  try {
    await loadScript(LIBS.jszip);
    const zip = new window.JSZip();
    images.forEach((img, i) => zip.file(img.name || ('image-' + (i + 1) + '.png'), img.blob));
    const blob = await zip.generateAsync({ type: 'blob' });
    downloadBlob(blob, 'images.zip');
    toast(`Zipped ${images.length} image${images.length === 1 ? '' : 's'}.`, 'ok');
  } catch (e) {
    toast(e.message, 'error', 'Zip failed');
  }
}

/* ============================================================================
   7. INPUT WIRING (paste, drag/drop, browse, chips)
   ========================================================================== */
let pasteDebounce;
$('#paste').addEventListener('input', (e) => {
  clearTimeout(pasteDebounce);
  pasteDebounce = setTimeout(() => {
    const text = e.target.value;
    // 'paste' is a reserved single source kept in sync with the textarea.
    const existing = state.sources.find(s => s.id === 'paste');
    if (!text.trim()) {
      if (existing) state.sources = state.sources.filter(s => s.id !== 'paste');
    } else if (existing) {
      existing.sieveText = text; existing.displayText = text;
    } else {
      state.sources.unshift({ id: 'paste', name: 'Pasted text', status: 'ok', sieveText: text, displayText: text, images: [], tables: [] });
    }
    renderChips();
    recompute();
  }, 180);
});

// File ingestion (from drop or browse)
async function ingestFiles(fileList) {
  const files = Array.from(fileList);
  for (const file of files) {
    const id = 'f' + Date.now() + Math.random().toString(36).slice(2, 7);
    const src = { id, name: file.name, size: file.size, status: 'busy', sieveText: '', displayText: '', images: [], tables: [] };
    state.sources.push(src);
    renderChips();

    try {
      // The watchdog aborts (and alerts) if parsing makes no progress — e.g. a
      // hung CDN load or a corrupt file that would otherwise spin forever.
      const norm = await withWatchdog('Parsing “' + file.name + '”', (beat) => parseFile(file, beat));
      Object.assign(src, norm, { status: 'ok' });
      toast(`Parsed “${file.name}”.`, 'ok');
    } catch (e) {
      src.status = 'err';
      src.error = e.message;
      toast(e.message, 'error', file.name, 9000); // errors linger so they can't be missed
    }
    renderChips();
    await recompute();
  }
}

function renderChips() {
  const wrap = $('#chips'); wrap.innerHTML = '';
  for (const src of state.sources) {
    const chip = el('div', { className: 'chip', title: src.status === 'err' && src.error ? src.error : '' });
    const dot = el('span', { className: 'chip-dot ' + (src.status === 'ok' ? 'ok' : src.status === 'err' ? 'err' : 'busy') });
    chip.append(dot);
    chip.append(el('span', { className: 'name', textContent: src.name }));
    if (src.status === 'busy') chip.append(el('span', { className: 'spin' }));
    else if (src.status === 'err') chip.append(el('span', { className: 'meta', style: 'color:var(--danger);font-weight:600;', textContent: 'failed' }));
    else if (src.size != null) chip.append(el('span', { className: 'meta', textContent: fmtBytes(src.size) }));
    const x = el('button', { className: 'chip-x', textContent: '×', title: 'Remove',
      onclick: () => {
        state.sources = state.sources.filter(s => s.id !== src.id);
        if (src.id === 'paste') $('#paste').value = '';
        renderChips(); recompute();
      } });
    chip.append(x);
    wrap.append(chip);
  }
}

/* drag & drop on the whole dropzone */
const dz = $('#dropzone');
['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add('dragover'); }));
['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, (e) => { e.preventDefault(); if (ev === 'drop' || e.target === dz) dz.classList.remove('dragover'); }));
dz.addEventListener('drop', (e) => { if (e.dataTransfer.files.length) ingestFiles(e.dataTransfer.files); });

$('#browseBtn').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', (e) => { if (e.target.files.length) ingestFiles(e.target.files); e.target.value = ''; });

$('#clearBtn').addEventListener('click', () => {
  state.sources = []; $('#paste').value = ''; state.results = null; state.display = {};
  renderChips(); renderPills(); renderPanel();
});

/* options re-run extraction without re-parsing files */
['#optDedupe', '#optSort'].forEach(sel => $(sel).addEventListener('change', recompute));

/* global filter — no re-parse, just re-render pills (matching counts) + panel */
let filterDebounce;
$('#globalFilter').addEventListener('input', (e) => {
  clearTimeout(filterDebounce);
  filterDebounce = setTimeout(() => {
    state.filter = e.target.value;
    updateFilterInfo();
    renderPills();
    renderPanel();
  }, 150);
});
function updateFilterInfo() {
  const info = $('#filterInfo');
  if (!getFilter() || !state.results) { info.textContent = ''; return; }
  const hits = CATEGORIES.filter(c => countOf(c.key) > 0).length;
  info.textContent = hits ? `Filtering — ${hits} categor${hits === 1 ? 'y' : 'ies'} with matches` : 'No matches anywhere';
}

/* tab switching (General / Engineering) — just re-renders, no re-parse */
$('#tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  state.tab = btn.dataset.tab;
  document.querySelectorAll('#tabs .tab').forEach(t => t.classList.toggle('active', t === btn));
  renderPills(); renderPanel();
});

// first paint
renderPills();
renderPanel();
</script>
